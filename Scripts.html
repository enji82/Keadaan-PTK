<script>
  // State Global
  let rawData = null;
  let activeTab = 'kebutuhanSD';
  let activeFormasiToggle = 'ALL'; // 'ALL', 'KS', 'GURU_KELAS', 'GURU_PAI', 'GURU_PJOK', 'GURU_KRISTEN', 'GURU_KATOLIK', 'MATRIX'
  let currentKebutuhanMode = 'KECAMATAN'; // 'KECAMATAN' (default) atau 'SEKOLAH' (saat drilldown)
  
  // State Khusus Tab 2: Keadaan PTK SD
  let activeKeadaanRoleToggle = 'ALL'; // 'ALL','KS','GURU_KELAS','GURU_PJOK','GURU_PAI','GURU_KRISTEN','GURU_KATOLIK','GURU_INGGRIS','GURU_LAIN','OP_LAYANAN','PENGELOLA_LAYANAN','PENATA_LAYANAN','PENGELOLA_UMUM','TENDIK_LAIN'
  let currentKeadaanMode = 'KECAMATAN'; // 'KECAMATAN' atau 'SEKOLAH'

  // State Khusus Tab 3: Proyeksi Pensiun SD
  let currentYear = new Date().getFullYear();
  let selectedPensiunYear = currentYear; // Default: Tahun ini
  let selectedPensiunMonth = null; // null = semua bulan di tahun terpilih, 1..12 = bulan tertentu
  let isPensiunTableVisible = true;

  document.addEventListener('DOMContentLoaded', () => {
    loadDashboardData(false);
  });

  function loadDashboardData(forceRefresh) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(handleDataSuccess)
      .withFailureHandler(handleDataError)
      .getDashboardData(forceRefresh);
  }

  function refreshData(force) {
    loadDashboardData(force);
  }

  function handleDataSuccess(data) {
    rawData = data;
    showLoading(false);

    if (data.lastUpdate) {
      document.getElementById('lastUpdatedBadge').textContent = 'Pembaruan: ' + data.lastUpdate;
    }

    populateKecamatanOptions(data.kecamatanList || []);

    // Render Semua Bagian
    renderKPIUmum();
    renderCardsFormasiSD();
    renderTabKebutuhanSD();
    renderTabKeadaanSD();
    renderTabPensiunSD();
  }

  function handleDataError(err) {
    showLoading(false);
    alert('Gagal mengambil data dari Google Apps Script: ' + (err.message || err));
  }

  function showLoading(show) {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) {
      overlay.style.display = show ? 'flex' : 'none';
    }
  }

  function populateKecamatanOptions(kecamatanList) {
    const select = document.getElementById('filterKecamatan');
    const curVal = select.value;
    select.innerHTML = '<option value="ALL">Semua Kecamatan</option>';
    
    kecamatanList.forEach(kec => {
      const opt = document.createElement('option');
      opt.value = kec;
      opt.textContent = kec;
      select.appendChild(opt);
    });

    if (curVal && kecamatanList.includes(curVal)) {
      select.value = curVal;
    }
  }

  /**
   * Helper: Dapatkan ringkasan Keadaan PTK SD berdasarkan filter kecamatan
   */
  function getFilteredSummaryKeadaan() {
    if (!rawData) return null;
    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';
    
    // Jika Semua Kecamatan, gunakan summarySD bawaan
    if (filterKec === 'ALL') {
      return rawData.summarySD || rawData.summary;
    }

    // Jika filter spesifik per kecamatan, agregasi dari sekolah-sekolah di kecamatan tersebut
    const sekolahList = (rawData.rekapSekolahSD || []).filter(s => s.kecamatan === filterKec);
    
    const res = {
      totalSekolah: sekolahList.length,
      totalPTK: 0,
      totalKS: 0,
      totalGuru: 0,
      totalTendik: 0,
      totalCPNS: 0,
      totalPNS: 0,
      totalPPPK: 0,
      totalPW: 0,
      totalNonASN: 0,
      totalNonAsnOld: 0,
      totalNonAsnNew: 0,
      kecamatan: filterKec
    };

    sekolahList.forEach(s => {
      res.totalPTK += (s.ptkCount || 0);
      res.totalKS += (s.ksCount || 0);
      res.totalGuru += (s.guruCount || 0);
      res.totalTendik += (s.tendikCount || 0);
      res.totalCPNS += (s.cpnsCount || 0);
      res.totalPNS += (s.pnsCount || 0);
      res.totalPPPK += (s.pppkCount || 0);
      res.totalPW += (s.pwCount || 0);
      res.totalNonASN += (s.nonAsnCount || 0);
      res.totalNonAsnOld += (s.nonAsnOldCount || 0);
      res.totalNonAsnNew += (s.nonAsnNewCount || 0);
    });

    return res;
  }

  /**
   * Render KPI Cards Umum (Tab 2: Keadaan PTK SD) - 2 Baris Card (Mengikuti Filter Utama)
   */
  function renderKPIUmum() {
    const summary = getFilteredSummaryKeadaan();
    if (!summary) return;

    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';

    // Baris 1: Total PTK SD, Kepala SD, Guru SD, Tenaga Kependidikan
    const elTotal = document.getElementById('kpiKeadaanTotalPTK');
    if (elTotal) elTotal.textContent = formatNumber(summary.totalPTK);

    const elSubSekolah = document.getElementById('kpiKeadaanSubSekolah');
    if (elSubSekolah) {
      if (filterKec === 'ALL') {
        elSubSekolah.textContent = `Mencakup ${formatNumber(summary.totalSekolah)} SD`;
      } else {
        elSubSekolah.textContent = `Kec. ${filterKec} (${formatNumber(summary.totalSekolah)} SD)`;
      }
    }

    const elKS = document.getElementById('kpiKeadaanTotalKS');
    if (elKS) elKS.textContent = formatNumber(summary.totalKS);

    const elGuru = document.getElementById('kpiKeadaanTotalGuru');
    if (elGuru) elGuru.textContent = formatNumber(summary.totalGuru);

    const elTendik = document.getElementById('kpiKeadaanTotalTendik');
    if (elTendik) elTendik.textContent = formatNumber(summary.totalTendik);

    // Baris 2: CPNS, PNS, PPPK, PPPK PW, NON ASN (rincian < & > 3-8-2023)
    const elCPNS = document.getElementById('kpiKeadaanTotalCPNS');
    if (elCPNS) elCPNS.textContent = formatNumber(summary.totalCPNS || 0);

    const elPNS = document.getElementById('kpiKeadaanTotalPNS');
    if (elPNS) elPNS.textContent = formatNumber(summary.totalPNS || 0);

    const elPPPK = document.getElementById('kpiKeadaanTotalPPPK');
    if (elPPPK) elPPPK.textContent = formatNumber(summary.totalPPPK || 0);

    const elPW = document.getElementById('kpiKeadaanTotalPW');
    if (elPW) elPW.textContent = formatNumber(summary.totalPW || 0);

    const elNonASN = document.getElementById('kpiKeadaanTotalNonASN');
    if (elNonASN) elNonASN.textContent = formatNumber(summary.totalNonASN || 0);

    const elNonOld = document.getElementById('kpiKeadaanNonAsnOld');
    if (elNonOld) elNonOld.textContent = `< 3-8-2023: ${formatNumber(summary.totalNonAsnOld || 0)}`;

    const elNonNew = document.getElementById('kpiKeadaanNonAsnNew');
    if (elNonNew) elNonNew.textContent = `> 3-8-2023: ${formatNumber(summary.totalNonAsnNew || 0)}`;
  }

  /**
   * Render 6 Card Kebutuhan Guru SD per Jenis PTK (Mengikuti Filter Utama)
   */
  function renderCardsFormasiSD() {
    if (!rawData || !rawData.kebutuhanSD || !rawData.kebutuhanSD.perSekolah) return;

    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';

    const totals = {
      ks: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      gk: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      pai: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      pjok: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      kristen: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      katolik: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 }
    };

    const sekolahList = (filterKec === 'ALL')
      ? rawData.kebutuhanSD.perSekolah
      : rawData.kebutuhanSD.perSekolah.filter(sd => sd.kecamatan === filterKec);

    sekolahList.forEach(sd => {
      const acc = (target, src) => {
        if (!src) return;
        target.butuh += (src.butuh || 0);
        target.terisi += (((src.cpns || 0) + (src.pns || 0) + (src.pppk || 0) + (src.pw || 0)));
        target.selisih += (src.selisih || 0);
        target.nonAsn += (src.nonAsn || 0);
        target.nonAsnOld += (src.nonAsnOld || 0);
        target.nonAsnNew += (src.nonAsnNew || 0);
      };

      acc(totals.ks, sd.ks);
      acc(totals.gk, sd.guruKelas);
      acc(totals.pai, sd.guruPai);
      acc(totals.pjok, sd.guruPjok);
      acc(totals.kristen, sd.guruKristen);
      acc(totals.katolik, sd.guruKatolik);
    });

    const setCard = (prefix, item) => {
      const valElem = document.getElementById(prefix + 'Selisih');
      const detElem = document.getElementById(prefix + 'Detail');
      if (valElem) {
        valElem.innerHTML = renderBadgeSelisihLarge(item.selisih);
      }
      if (detElem) {
        detElem.textContent = `Butuh: ${formatNumber(item.butuh)} | Terisi: ${formatNumber(item.terisi)} | Non: ${formatNumber(item.nonAsnOld)} (<) / ${formatNumber(item.nonAsnNew)} (>)`;
      }
    };

    setCard('kpiKs', totals.ks);
    setCard('kpiGk', totals.gk);
    setCard('kpiPai', totals.pai);
    setCard('kpiPjok', totals.pjok);
    setCard('kpiKristen', totals.kristen);
    setCard('kpiKatolik', totals.katolik);
  }

  function renderBadgeSelisihLarge(val) {
    if (val < 0) return `<span style="color:#dc2626;">${val}</span> <span style="font-size:0.9rem; font-weight:600; color:#ef4444;">Kurang</span>`;
    if (val === 0) return `<span style="color:#16a34a;">0</span> <span style="font-size:0.9rem; font-weight:600; color:#22c55e;">Pas</span>`;
    return `<span style="color:#0284c7;">+${val}</span> <span style="font-size:0.9rem; font-weight:600; color:#0ea5e9;">Lebih</span>`;
  }

  /**
   * Ubah Toggle Jenis PTK untuk Tabel Kebutuhan SD
   */
  function setFormasiToggle(formasiKey) {
    activeFormasiToggle = formasiKey;
    document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
    
    const activeBtn = document.getElementById('btnTog_' + formasiKey);
    if (activeBtn) activeBtn.classList.add('active');

    renderTabKebutuhanSD();
  }

  /**
   * Handler Perubahan Dropdown Kecamatan di Toolbar
   */
  function onFilterKecamatanChange() {
    const selectedKec = document.getElementById('filterKecamatan').value;
    if (selectedKec === 'ALL') {
      currentKebutuhanMode = 'KECAMATAN';
      currentKeadaanMode = 'KECAMATAN';
    } else {
      currentKebutuhanMode = 'SEKOLAH';
      currentKeadaanMode = 'SEKOLAH';
    }
    applyFilters();
  }

  /**
   * Aksi Drilldown: Klik nama kecamatan untuk melihat sekolah-sekolahnya
   */
  function drillDownToKecamatan(kecamatanName) {
    const selKec = document.getElementById('filterKecamatan');
    selKec.value = kecamatanName;
    currentKebutuhanMode = 'SEKOLAH';
    currentKeadaanMode = 'SEKOLAH';
    renderCardsFormasiSD();
    renderKPIUmum();
    renderTabKebutuhanSD();
  }

  /**
   * Tombol Reload Data Kecamatan: kembali ke tampilan awal kecamatan
   */
  function resetToKecamatanView() {
    const selKec = document.getElementById('filterKecamatan');
    selKec.value = 'ALL';
    currentKebutuhanMode = 'KECAMATAN';
    currentKeadaanMode = 'KECAMATAN';
    renderCardsFormasiSD();
    renderKPIUmum();
    renderTabKebutuhanSD();
  }

  /**
   * TAB 1: Render Kebutuhan Guru SD
   */
  function renderTabKebutuhanSD() {
    if (!rawData || !rawData.kebutuhanSD) return;

    const thead = document.getElementById('theadKebutuhanSD');
    const tbody = document.getElementById('tbodyKebutuhanSD');
    const tfoot = document.getElementById('tfootKebutuhanSD');
    const breadcrumbWrap = document.getElementById('breadcrumbWrap');

    const filterKec = document.getElementById('filterKecamatan').value;
    const filterStatus = document.getElementById('filterStatusKebutuhan').value;
    const searchEl = document.getElementById('searchSekolah');
    const searchVal = searchEl ? searchEl.value.toLowerCase().trim() : '';

    // Kamus Label Formasi
    const formasiConfig = {
      'ALL': { key: 'total', label: 'TOTAL SELURUH GURU SD' },
      'KS': { key: 'ks', label: 'Kepala Sekolah' },
      'GURU_KELAS': { key: 'guruKelas', label: 'Guru Kelas' },
      'GURU_PAI': { key: 'guruPai', label: 'Guru PAI' },
      'GURU_PJOK': { key: 'guruPjok', label: 'Guru PJOK' },
      'GURU_KRISTEN': { key: 'guruKristen', label: 'Guru PA Kristen' },
      'GURU_KATOLIK': { key: 'guruKatolik', label: 'Guru PA Katolik' }
    };

    const activeConf = formasiConfig[activeFormasiToggle] || formasiConfig.ALL;
    const fKey = activeConf.key;

    // -------------------------------------------------------------
    // KONDISI A: TAMPILAN PER KECAMATAN (DEFAULT)
    // -------------------------------------------------------------
    if (currentKebutuhanMode === 'KECAMATAN') {
      breadcrumbWrap.style.display = 'none'; // Sembunyikan badge/breadcrumb

      let list = (rawData.kebutuhanSD.perKecamatan || []).slice();

      // Filter Status
      if (filterStatus !== 'ALL') {
        list = list.filter(k => {
          let targetEval = k.total;
          if (activeFormasiToggle !== 'ALL' && activeFormasiToggle !== 'MATRIX') {
            if (k[fKey]) targetEval = k[fKey];
          }
          if (filterStatus === 'KURANG' && targetEval.selisih >= 0) return false;
          if (filterStatus === 'PAS' && targetEval.selisih !== 0) return false;
          if (filterStatus === 'LEBIH' && targetEval.selisih <= 0) return false;
          return true;
        });
      }

      // Filter Pencarian jika diisi
      if (searchVal) {
        list = list.filter(k => k.kecamatan && k.kecamatan.toLowerCase().includes(searchVal));
      }

      // SORTING: Kekurangan terbanyak (selisih paling minus) di baris paling atas
      list.sort((a, b) => {
        const valA = (activeFormasiToggle === 'ALL' || activeFormasiToggle === 'MATRIX') ? a.total.selisih : (a[fKey] ? a[fKey].selisih : 0);
        const valB = (activeFormasiToggle === 'ALL' || activeFormasiToggle === 'MATRIX') ? b.total.selisih : (b[fKey] ? b[fKey].selisih : 0);
        return valA - valB;
      });

      if (activeFormasiToggle === 'MATRIX') {
        // Matriks Semua Formasi per Kecamatan
        thead.innerHTML = `
          <tr>
            <th rowspan="2" class="text-center" style="vertical-align: middle;">No</th>
            <th rowspan="2" style="vertical-align: middle;">Kecamatan</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>SD</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Murid</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Rombel</th>
            <th colspan="3" class="text-center mat-ks">Kepala Sekolah</th>
            <th colspan="3" class="text-center mat-kel">Guru Kelas</th>
            <th colspan="3" class="text-center mat-pai">Guru PAI</th>
            <th colspan="3" class="text-center mat-pjok">Guru PJOK</th>
            <th colspan="3" class="text-center mat-kri">Guru Kristen</th>
            <th colspan="3" class="text-center mat-kat">Guru Katolik</th>
            <th colspan="7" class="text-center mat-tot">TOTAL GURU SD</th>
          </tr>
          <tr>
            <th class="text-center mat-ks">Bth</th><th class="text-center mat-ks">Ada</th><th class="text-center mat-ks">+/-</th>
            <th class="text-center mat-kel">Bth</th><th class="text-center mat-kel">Ada</th><th class="text-center mat-kel">+/-</th>
            <th class="text-center mat-pai">Bth</th><th class="text-center mat-pai">Ada</th><th class="text-center mat-pai">+/-</th>
            <th class="text-center mat-pjok">Bth</th><th class="text-center mat-pjok">Ada</th><th class="text-center mat-pjok">+/-</th>
            <th class="text-center mat-kri">Bth</th><th class="text-center mat-kri">Ada</th><th class="text-center mat-kri">+/-</th>
            <th class="text-center mat-kat">Bth</th><th class="text-center mat-kat">Ada</th><th class="text-center mat-kat">+/-</th>
            <th class="text-center mat-tot-bth">Butuh</th>
            <th class="text-center mat-tot">PNS</th>
            <th class="text-center mat-tot">PPPK</th>
            <th class="text-center mat-tot">PW</th>
            <th class="text-center mat-tot-sel">+/-</th>
            <th class="text-center mat-tot" style="line-height:1.2;">Non-ASN<br>&lt; 3-8-23</th>
            <th class="text-center mat-tot" style="line-height:1.2;">Non-ASN<br>&gt; 3-8-23</th>
          </tr>
        `;

        let html = '';
        let totSekolah = 0, totMurid = 0, totRombel = 0, totBth = 0, totPns = 0, totPppk = 0, totPw = 0, totSelisih = 0, totNonOld = 0, totNonNew = 0;

        list.forEach((k, idx) => {
          totSekolah += k.jmlSekolah;
          totMurid += (k.totalMurid || 0);
          totRombel += k.totalRombel;
          totBth += k.total.butuh;
          totPns += k.total.pns;
          totPppk += k.total.pppk;
          totPw += k.total.pw;
          totSelisih += k.total.selisih;
          totNonOld += (k.total.nonAsnOld || 0);
          totNonNew += (k.total.nonAsnNew || 0);

          const renderKecFormasi = (f, cls) => `
            <td class="text-center ${cls}">${formatNumber(f.butuh)}</td>
            <td class="text-center ${cls}">${formatNumber(f.pns + f.pppk + f.pw)}</td>
            <td class="text-center ${cls}">${renderBadgeSelisih(f.selisih)}</td>
          `;

          html += `
            <tr class="clickable-row" onclick="drillDownToKecamatan('${escapeQuote(k.kecamatan)}')" title="Klik untuk melihat sekolah-sekolah di Kec. ${escapeHtml(k.kecamatan)}">
              <td class="text-center">${idx + 1}</td>
              <td>${escapeHtml(k.kecamatan)}</td>
              <td class="text-center">${formatNumber(k.jmlSekolah)}</td>
              <td class="text-center">${formatNumber(k.totalMurid || 0)}</td>
              <td class="text-center">${formatNumber(k.totalRombel)}</td>
              ${renderKecFormasi(k.ks, 'mat-ks')}
              ${renderKecFormasi(k.guruKelas, 'mat-kel')}
              ${renderKecFormasi(k.guruPai, 'mat-pai')}
              ${renderKecFormasi(k.guruPjok, 'mat-pjok')}
              ${renderKecFormasi(k.guruKristen, 'mat-kri')}
              ${renderKecFormasi(k.guruKatolik, 'mat-kat')}
              <td class="text-center mat-tot-bth">${formatNumber(k.total.butuh)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.pns)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.pppk)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.pw)}</td>
              <td class="text-center mat-tot-sel">${renderBadgeSelisih(k.total.selisih)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.nonAsnOld)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.nonAsnNew)}</td>
            </tr>
          `;
        });

        tbody.innerHTML = html || '<tr><td colspan="30" class="text-center" style="padding: 24px;">Tidak ada data kecamatan.</td></tr>';
        tfoot.innerHTML = `
          <tr>
            <th colspan="2" class="text-center">TOTAL KESELURUHAN</th>
            <th class="text-center">${formatNumber(totSekolah)}</th>
            <th class="text-center">${formatNumber(totMurid)}</th>
            <th class="text-center">${formatNumber(totRombel)}</th>
            <th colspan="18" class="text-center" style="color:#64748b;">- Akumulasi Seluruh Formasi Tertera di Kolom Total -</th>
            <th class="text-center mat-tot-bth">${formatNumber(totBth)}</th>
            <th class="text-center mat-tot">${formatNumber(totPns)}</th>
            <th class="text-center mat-tot">${formatNumber(totPppk)}</th>
            <th class="text-center mat-tot">${formatNumber(totPw)}</th>
            <th class="text-center mat-tot-sel">${renderBadgeSelisih(totSelisih)}</th>
            <th class="text-center mat-tot">${formatNumber(totNonOld)}</th>
            <th class="text-center mat-tot">${formatNumber(totNonNew)}</th>
          </tr>
        `;

      } else {
        // Tampilan Ringkas & Fokus per Kecamatan dengan Header Bertingkat
        thead.innerHTML = `
          <tr>
            <th rowspan="2" class="text-center" style="width: 48px; vertical-align: middle;">No</th>
            <th rowspan="2" style="vertical-align: middle;">Kecamatan</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>SD</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Murid</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Rombel</th>
            <th rowspan="2" class="text-center col-kebutuhan" style="vertical-align: middle;">Kebutuhan</th>
            <th colspan="5" class="text-center col-keadaan" style="border-bottom: 1px solid var(--border-color);">Keadaan</th>
            <th rowspan="2" class="text-center col-selisih" style="vertical-align: middle;">+/-</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Non-ASN<br>&lt; 3-8-2023</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Non-ASN<br>&gt; 3-8-2023</th>
          </tr>
          <tr>
            <th class="text-center col-keadaan">CPNS</th>
            <th class="text-center col-keadaan">PNS</th>
            <th class="text-center col-keadaan">PPPK</th>
            <th class="text-center col-keadaan">PW</th>
            <th class="text-center col-keadaan-total">Jumlah</th>
          </tr>
        `;

        let html = '';
        let totSekolah = 0, totMurid = 0, totRombel = 0, totBth = 0, totCpns = 0, totPns = 0, totPppk = 0, totPw = 0, totTerisi = 0, totSelisih = 0, totNonOld = 0, totNonNew = 0;

        list.forEach((k, idx) => {
          const f = k[fKey];

  function renderBadgeSelisih(val) {
    if (val < 0) {
      return `<span style="color:#b91c1c;">${val}</span>`;
    } else if (val === 0 || !val) {
      return `<span>-</span>`;
    } else {
      return `<span style="color:#0369a1;">+${val}</span>`;
    }
  }

  function formatNumber(num) {
    if (num === 0 || num === '0' || !num) return '-';
    return Number(num).toLocaleString('id-ID');
  }

  /**

  function setKeadaanRoleToggle(roleKey) {

    document.querySelectorAll('#tabKeadaanSD .toggle-btn').forEach(btn => btn.classList.remove('active'));

    const activeBtn = document.getElementById('btnKeadaanTog_' + roleKey);
    if (activeBtn) activeBtn.classList.add('active');

    renderTabKeadaanSD();
  }

    renderKPIUmum();

  function applyFilters() {
    if (!rawData) return;
    renderCardsFormasiSD();
    renderKPIUmum();
    renderTabKebutuhanSD();
    renderTabKeadaanSD();
    renderTabPensiunSD();
  }

  function switchTab(tabKey) {
    activeTab = tabKey;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

    const wrapFilterStatus = document.getElementById('wrapFilterStatusKebutuhan');

    if (tabKey === 'kebutuhanSD') {
      const btn = document.getElementById('tabBtnKebutuhanSD');
      const pane = document.getElementById('tabKebutuhanSD');
      if (btn) btn.classList.add('active');
      if (pane) pane.classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'flex';
      renderTabKebutuhanSD();
    } else if (tabKey === 'keadaanSD') {
      const btn = document.getElementById('tabBtnKeadaanSD');
      const pane = document.getElementById('tabKeadaanSD');
      if (btn) btn.classList.add('active');
      if (pane) pane.classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'none';
      renderTabKeadaanSD();
    } else if (tabKey === 'pensiunSD') {
      const btn = document.getElementById('tabBtnPensiunSD');
      const pane = document.getElementById('tabPensiunSD');
      if (btn) btn.classList.add('active');
      if (pane) pane.classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'none';
      renderTabPensiunSD();
    }
  }

  function viewSchoolDetail(npsn, namaSekolah) {
    const modal = document.getElementById('detailModal');
    const modalName = document.getElementById('modalSchoolName');
    const modalMeta = document.getElementById('modalSchoolMeta');
    const modalLoading = document.getElementById('modalLoading');
    const modalTableWrap = document.getElementById('modalTableWrap');
    const modalTbody = document.getElementById('modalTbody');

    modalName.textContent = namaSekolah;
    modalMeta.textContent = `NPSN: ${npsn}`;
    modalLoading.style.display = 'block';
    modalTableWrap.style.display = 'none';
    modal.style.display = 'flex';

    google.script.run
      .withSuccessHandler(res => {
        modalLoading.style.display = 'none';
        modalTableWrap.style.display = 'block';

        if (!res || !res.pegawai) {
          const errMsg = (res && res.error) ? `<br><small style="color:#ef4444;">${escapeHtml(res.error)}</small>` : '';
          modalTbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding: 24px; color: #ef4444;">Gagal memuat data pegawai.${errMsg}</td></tr>`;
          return;
        }

        let html = '';
        if (res.pegawai.length > 0) {
          res.pegawai.forEach((p, idx) => {
            let statusBadge = `<span class="badge badge-nonasn">${escapeHtml(p.statusNorm)}</span>`;
            const sNormUpper = String(p.statusNorm || '').toUpperCase();
            if (sNormUpper === 'CPNS') {
              statusBadge = `<span class="badge badge-cpns">CPNS</span>`;
            } else if (sNormUpper === 'PNS') {
              statusBadge = `<span class="badge badge-pns">PNS</span>`;
            } else if (sNormUpper === 'PPPK') {
              statusBadge = `<span class="badge badge-pppk">PPPK</span>`;
            } else if (sNormUpper === 'PW') {
              statusBadge = `<span class="badge badge-pw">PW</span>`;
            } else if (sNormUpper === 'NON-ASN' || sNormUpper === 'NON ASN') {
              const badgeClass = p.tmtCategory === 'OLD' ? 'badge-nonasn-old' : 'badge-nonasn-new';
              const labelCategory = p.tmtCategory === 'OLD' ? '< 3-8-23' : '> 3-8-23';
              const tmtInfo = p.tmtFormatted ? ` (${p.tmtFormatted})` : '';
              statusBadge = `<span class="badge ${badgeClass}" title="TMT: ${p.tmtFormatted || '-'}">Non-ASN ${labelCategory}${tmtInfo}</span>`;
            }

            const nipLabel = (p.nip && p.nip !== '-') ? `NIP. ${escapeHtml(p.nip)}` : 'NIP: -';

            html += `
              <tr>
                <td class="text-center">${idx + 1}</td>
                <td class="modal-col-nama">
                  <div style="font-weight: 600; color: var(--secondary);">${escapeHtml(p.nama)}</div>
                  <div style="font-size: 0.74rem; color: #64748b; margin-top: 2px; font-family: monospace;">${nipLabel}</div>
                </td>
                <td class="modal-col-tugas">${escapeHtml(p.tugas || '-')}</td>
                <td class="text-center modal-col-status">${statusBadge}</td>
                <td class="text-center modal-col-pangkat" style="font-weight: 500; color: #334155;">${escapeHtml(p.pangkatGol || '-')}</td>
              </tr>
            `;
          });
        } else {
          html = '<tr><td colspan="5" class="text-center" style="padding: 24px; color: #64748b;">Tidak ada data pegawai terdaftar untuk sekolah ini di database.</td></tr>';
        }
        modalTbody.innerHTML = html;
      })

  function cleanTableForExcelExport(originalTable, isSekolahMode) {
    const clone = originalTable.cloneNode(true);

    if (isSekolahMode) {
      const rows = clone.querySelectorAll('tr');
      rows.forEach(row => {
        const lastCell = row.lastElementChild;
        if (lastCell) {
          row.removeChild(lastCell);
        }
      });
    }

    const allRows = clone.querySelectorAll('tr');
    allRows.forEach(row => {
      const cells = row.querySelectorAll('th, td');
      cells.forEach(cell => {
        let txt = cell.textContent.trim();

        if (txt === '-') {
          cell.textContent = '0';
          return;
        }

        const cleanDigitsOnly = txt.replace(/^[+\-]/, '').replace(/[\.,\s]/g, '');
        if (/^\d+$/.test(cleanDigitsOnly)) {
          const isNegative = txt.startsWith('-');
          const numericVal = parseInt(cleanDigitsOnly, 10);
          cell.textContent = String(isNegative ? -numericVal : numericVal);
        }
      });
    });

    return clone;
  }

  /**
   * Render Utama Tab 3: Proyeksi Pensiun SD
   */
  function renderTabPensiunSD() {
    if (!rawData) return;

    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';
    let list = (rawData.pensiunSD || []).slice();

    // Filter Wilayah Kecamatan (Filter Utama)
    if (filterKec !== 'ALL') {
      list = list.filter(p => p.kecamatan === filterKec);
    }

    // 1. Render Tombol Pilihan Tahun (Dinamis Rentang 5 Tahun: Tahun Ini s/d +4 Tahun)
    renderPensiunYearButtons();

    // 2. Filter Data Berdasarkan Tahun Terpilih
    const yearList = list.filter(p => p.pensiunTahun === selectedPensiunYear);

    // Helper hitung breakdown status (PNS, PPPK, PW, Non-ASN)
    const createStatusBreakdown = () => ({ pns: 0, pppk: 0, pw: 0, nonAsn: 0, total: 0 });
    const statKS = createStatusBreakdown();
    const statGuru = createStatusBreakdown();
    const statTendik = createStatusBreakdown();

    yearList.forEach(p => {
      // Tentukan kelompok peran
      let cat = p.roleCategory;
      if (!cat) {
        cat = p.isGuruKs ? 'GURU' : 'TENDIK';
      }

      let target = statTendik;
      if (cat === 'KS') target = statKS;
      else if (cat === 'GURU') target = statGuru;

      target.total++;
      const s = p.status || 'Non-ASN';
      if (s === 'PNS' || s === 'CPNS') target.pns++;
      else if (s === 'PPPK') target.pppk++;
      else if (s === 'PW') target.pw++;
      else target.nonAsn++;
    });

    // Helper format teks breakdown PNS | PPPK | PPPK PW | Non ASN (badge tag identik Tab 1 & Tab 2)
    const formatBreakdownText = (st) => {
      return `<div class="pensiun-status-breakdown">` +
             `<span class="pensiun-tag-pns" title="PNS">PNS: ${formatNumber(st.pns)}</span>` +
             `<span class="pensiun-tag-pppk" title="PPPK Penuh Waktu">PPPK: ${formatNumber(st.pppk)}</span>` +
             `<span class="pensiun-tag-pw" title="PPPK Paruh Waktu">PW: ${formatNumber(st.pw)}</span>` +
             `<span class="pensiun-tag-nonasn" title="Non ASN">Non ASN: ${formatNumber(st.nonAsn)}</span>` +
             `</div>`;
    };

    // Card 1: Total Pensiun Tahun XXXX
    const elYearTitle = document.getElementById('kpiPensiunYearTitle');
    const elYearCount = document.getElementById('kpiPensiunYearCount');
    const elYearDetail = document.getElementById('kpiPensiunYearDetail');
    if (elYearTitle) elYearTitle.textContent = `PENSIUN TAHUN ${selectedPensiunYear}`;
    if (elYearCount) elYearCount.textContent = formatNumber(yearList.length);
    if (elYearDetail) elYearDetail.textContent = `KS: ${formatNumber(statKS.total)} | Guru: ${formatNumber(statGuru.total)} | Tendik: ${formatNumber(statTendik.total)}`;

    // Card 2: Kepala SD
    const elKsCount = document.getElementById('kpiPensiunKsCount');
    const elKsDetail = document.getElementById('kpiPensiunKsDetail');
    if (elKsCount) elKsCount.textContent = formatNumber(statKS.total);
    if (elKsDetail) elKsDetail.innerHTML = formatBreakdownText(statKS);

    // Card 3: Guru SD
    const elGuruCount = document.getElementById('kpiPensiunGuruCount');
    const elGuruDetail = document.getElementById('kpiPensiunGuruDetail');
    if (elGuruCount) elGuruCount.textContent = formatNumber(statGuru.total);
    if (elGuruDetail) elGuruDetail.innerHTML = formatBreakdownText(statGuru);

    // Card 4: Tendik
    const elTendikCount = document.getElementById('kpiPensiunTendikCount');
    const elTendikDetail = document.getElementById('kpiPensiunTendikDetail');
    if (elTendikCount) elTendikCount.textContent = formatNumber(statTendik.total);
    if (elTendikDetail) elTendikDetail.innerHTML = formatBreakdownText(statTendik);

    // 3. Render Timeline Bar Chart Bulanan (Dibagi 4 Kriteria & Dibedakan Warna)
    renderPensiunBarChart(yearList);

    // 4. Render Tabel Daftar Nama Pensiun
    const bulanIndo = [

      'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'

      ? yearList.filter(p => p.pensiunBulan === selectedPensiunMonth)

      } else {

  /**

    });

  /**
   * Render Bar Chart Bulanan (Jan - Des) dengan Stacked Bars 4 Kriteria (PNS, PPPK, PPPK PW, Non-ASN)
   */
  function renderPensiunBarChart(yearList) {
    const container = document.getElementById('pensiunChartBars');
    const titleEl = document.getElementById('pensiunChartTitle');
    if (titleEl) titleEl.textContent = `TIMELINE PENSIUN PER BULAN (${selectedPensiunYear})`;
    if (!container) return;

    const bulanShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    
    // Hitung per bulan (1 - 12) dengan rincian 4 kriteria: pns, pppk, pw, nonAsn
    const monthlyData = [];
    for (let m = 0; m <= 12; m++) {
      monthlyData.push({ pns: 0, pppk: 0, pw: 0, nonAsn: 0, total: 0 });
    }

    yearList.forEach(p => {
      const m = p.pensiunBulan;
      if (m >= 1 && m <= 12) {
        const slot = monthlyData[m];
        slot.total++;
        const s = p.status || 'Non-ASN';
        if (s === 'PNS' || s === 'CPNS') slot.pns++;
        else if (s === 'PPPK') slot.pppk++;
        else if (s === 'PW') slot.pw++;
        else slot.nonAsn++;
      }
    });

    const maxTotal = Math.max(...monthlyData.slice(1).map(d => d.total), 1);

    let html = '';
    for (let m = 1; m <= 12; m++) {
      const d = monthlyData[m];
      const isSel = (selectedPensiunMonth === m);
      
      // Hitung tinggi proporsional total & per segmen (terhadap maxTotal)
      const trackHeight = 140; // tinggi maksimal px pada track bar
      const totalBarHeightPx = d.total > 0 ? Math.max((d.total / maxTotal) * trackHeight, 14) : 0;
      
      // Proporsi masing-masing kriteria di dalam bar
      const pnsPct = d.total > 0 ? (d.pns / d.total) * 100 : 0;
      const pppkPct = d.total > 0 ? (d.pppk / d.total) * 100 : 0;
      const pwPct = d.total > 0 ? (d.pw / d.total) * 100 : 0;
      const nonAsnPct = d.total > 0 ? (d.nonAsn / d.total) * 100 : 0;

      // Tooltip informatif saat hover
      const tooltip = `${bulanShort[m-1]} ${selectedPensiunYear} (Total: ${d.total})\n• PNS: ${d.pns}\n• PPPK: ${d.pppk}\n• PPPK PW: ${d.pw}\n• Non ASN: ${d.nonAsn}`;

      html += `
        <div class="pensiun-bar-col ${isSel ? 'selected' : ''}" onclick="selectPensiunMonth(${m})" title="${tooltip}">
          <div class="pensiun-bar-value">${d.total > 0 ? d.total : ''}</div>
          <div class="pensiun-bar-track">
            ${d.total > 0 ? `
              <div class="pensiun-bar-wrapper" style="height: ${totalBarHeightPx}px; width: 100%; display: flex; flex-direction: column-reverse; overflow: hidden; border-radius: 5px 5px 0 0;">
                ${d.pns > 0 ? `<div class="pensiun-bar-segment segment-pns" style="height: ${pnsPct}%;" title="PNS: ${d.pns}"></div>` : ''}
                ${d.pppk > 0 ? `<div class="pensiun-bar-segment segment-pppk" style="height: ${pppkPct}%;" title="PPPK: ${d.pppk}"></div>` : ''}
                ${d.pw > 0 ? `<div class="pensiun-bar-segment segment-pw" style="height: ${pwPct}%;" title="PPPK PW: ${d.pw}"></div>` : ''}
                ${d.nonAsn > 0 ? `<div class="pensiun-bar-segment segment-nonasn" style="height: ${nonAsnPct}%;" title="Non ASN: ${d.nonAsn}"></div>` : ''}
              </div>
            ` : ''}
          </div>
          <div class="pensiun-bar-label">${bulanShort[m-1]}</div>
        </div>
      `;
    }

    container.innerHTML = html;
  }

  /**
   * Render Tabel Daftar Nama Pensiun
   */
  function renderPensiunTable(list) {
    const tbody = document.getElementById('tbodyPensiunList');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="text-center" style="padding: 24px; color: var(--text-muted);">
            Tidak ada proyeksi pensiun ASN pada periode/filter ini.
          </td>
        </tr>
      `;
      return;
    }

    // Urutkan berdasarkan bulan pensiun, lalu nama
    list.sort((a, b) => {
      if (a.pensiunBulan !== b.pensiunBulan) return a.pensiunBulan - b.pensiunBulan;
      return a.nama.localeCompare(b.nama);
    });

    let html = '';
    list.forEach((p, idx) => {
      let statusBadge = '';
      const s = p.status || 'Non-ASN';
      if (s === 'PNS' || s === 'CPNS') {
        statusBadge = `<span class="badge" style="background:#fee2e2; color:#991b1b; font-weight:700;">${escapeHtml(s)}</span>`;
      } else if (s === 'PPPK') {
        statusBadge = '<span class="badge" style="background:#dcfce7; color:#166534; font-weight:700;">PPPK</span>';
      } else if (s === 'PW') {
        statusBadge = '<span class="badge" style="background:#f3e8ff; color:#7e22ce; font-weight:700;">PPPK PW</span>';
      } else {
        statusBadge = '<span class="badge" style="background:#fef3c7; color:#92400e; font-weight:700;">Non ASN</span>';
      }

      html += `
        <tr>
          <td class="text-center" style="font-weight: 600;">${idx + 1}</td>
          <td style="font-weight: 700; color: var(--secondary);">${escapeHtml(p.nama)}</td>
          <td style="font-family: monospace; font-size: 0.85rem;">${escapeHtml(p.nip)}</td>
          <td>${escapeHtml(p.unitKerja)}</td>
          <td>${escapeHtml(p.jabatan)}</td>
          <td class="text-center">${statusBadge}</td>
          <td class="text-center">${escapeHtml(p.tglLahir)}</td>
          <td class="text-center" style="font-weight: 700;">${p.bup}</td>
          <td class="text-center" style="font-weight: 700; color: #881337;">${escapeHtml(p.pensiunTmt)}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  /**
   * Ekspor Tabel Proyeksi Pensiun ke Excel
   */
  function exportTablePensiunSDToExcel() {
    if (!rawData) return;

    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';
    let list = (rawData.pensiunSD || []).slice();

    // Filter Wilayah Kecamatan
    if (filterKec !== 'ALL') {
      list = list.filter(p => p.kecamatan === filterKec);
    }

    // Filter Tahun
    const yearList = list.filter(p => p.pensiunTahun === selectedPensiunYear);

    // Filter Bulan jika dipilih
    const tableList = selectedPensiunMonth !== null 
      ? yearList.filter(p => p.pensiunBulan === selectedPensiunMonth)
      : yearList;

    if (!tableList || tableList.length === 0) {
      alert('Tidak ada data pensiun untuk diekspor pada filter ini.');
      return;
    }

    // Urutkan seperti tampilan di tabel
    tableList.sort((a, b) => {
      if (a.pensiunBulan !== b.pensiunBulan) return a.pensiunBulan - b.pensiunBulan;
      return a.nama.localeCompare(b.nama);
    });

    const bulanIndo = [
      '', 'JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI',
      'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'
    ];

    const bulanTitle = selectedPensiunMonth !== null ? ` BULAN ${bulanIndo[selectedPensiunMonth]}` : '';
    const mainTitle = `PROYEKSI PENSIUN SD NEGERI TAHUN ${selectedPensiunYear}${bulanTitle} - WILAYAH ${filterKec.toUpperCase()}`;
    const subTitle = `Tanggal Ekspor: ${new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}`;

    // Susun array of array secara murni tanpa konversi html table agar tipe string NIP tidak terpotong
    const headers = ['NO', 'NAMA LENGKAP', 'NIP', 'UNIT KERJA', 'JABATAN', 'STATUS', 'TGL LAHIR', 'BUP', 'PENSIUN'];
    const rows = [];

    tableList.forEach((p, idx) => {
      const nipStr = (p.nip && p.nip !== '-') ? String(p.nip).trim() : '-';
      let statusLabel = p.status || 'Non-ASN';
      if (statusLabel === 'PW') statusLabel = 'PPPK PW';

      rows.push([
        idx + 1,
        p.nama || '-',
        nipStr,
        p.unitKerja || '-',
        p.jabatan || '-',
        statusLabel,
        p.tglLahir || '-',
        p.bup || 60,
        p.pensiunTmt || '-'
      ]);
    });

    // Buat worksheet dari AOA (Array of Arrays)
    const wsData = [
      [mainTitle],
      [subTitle],
      [], // baris kosong 3
      headers,
      ...rows
    ];

    const ws = XLSX.utils.aoa_to_sheet(wsData);

    // Set tipe data Kolom C (NIP) menjadi teks string ('s') dengan format '@'
    if (ws['!ref']) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      // Kolom C adalah index 2 (A=0, B=1, C=2). Baris data mulai baris ke-5 (index 4)
      for (let R = 4; R <= range.e.r; ++R) {
        const cellAddress = XLSX.utils.encode_cell({ r: R, c: 2 });
        const cell = ws[cellAddress];
        if (cell && cell.v !== undefined && cell.v !== null) {
          const sVal = String(cell.v).trim();
          cell.t = 's'; // Pastikan tipe data Cell adalah Text/String
          cell.v = sVal;
          cell.w = sVal;
          cell.z = '@';
        }
      }
    }

    // Set lebar kolom otomatis agar nyaman dibaca di Excel
    ws['!cols'] = [
      { wch: 6 },  // NO
      { wch: 36 }, // NAMA LENGKAP
      { wch: 24 }, // NIP (cukup lebar untuk 18 digit)
      { wch: 32 }, // UNIT KERJA
      { wch: 28 }, // JABATAN
      { wch: 14 }, // STATUS
      { wch: 14 }, // TGL LAHIR
      { wch: 8 },  // BUP
      { wch: 18 }  // PENSIUN
    ];

    const fileName = `Proyeksi_Pensiun_SD_${selectedPensiunYear}_${filterKec.replace(/\s+/g, '_')}.xlsx`;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Pensiun SD");
    XLSX.writeFile(wb, fileName);
  }


  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeQuote(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'");
  }
</script>
