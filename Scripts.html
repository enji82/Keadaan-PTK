  function getActiveJenjang() {
    const el = document.getElementById('filterJenjang');
    return el ? el.value : 'SD';
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadDashboardData(false);
  });

  function loadDashboardData(forceRefresh) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(handleDataSuccess)
      .withFailureHandler(handleDataError)
      .getDashboardData(forceRefresh);
  }

  function refreshData(force) {
    loadDashboardData(force);
  }

  function handleDataSuccess(data) {
    rawData = data;
    showLoading(false);

    if (data.lastUpdate) {
      document.getElementById('lastUpdatedBadge').textContent = 'Pembaruan: ' + data.lastUpdate;
    }

    populateKecamatanOptions(data.kecamatanList || []);

    // Render Tab Buttons and Controls
    try { updateUIForActiveJenjang(); } catch (e) { console.error('Error updateUIForActiveJenjang:', e); }

    // Render Semua Bagian
    try { renderKPIUmum(); } catch (e) { console.error('Error renderKPIUmum:', e); }
    try { renderCardsFormasi(); } catch (e) { console.error('Error renderCardsFormasi:', e); }
    try { renderTabKebutuhan(); } catch (e) { console.error('Error renderTabKebutuhan:', e); }
    try { renderTabKeadaan(); } catch (e) { console.error('Error renderTabKeadaan:', e); }
    try { renderTabPensiun(); } catch (e) { console.error('Error renderTabPensiun:', e); }
  }

  function handleDataError(err) {
    showLoading(false);
    alert('Gagal mengambil data dari Google Apps Script: ' + (err.message || err));
  }

  function showLoading(show) {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) {
      overlay.style.display = show ? 'flex' : 'none';
    }
  }

  function populateKecamatanOptions(kecamatanList) {
    const select = document.getElementById('filterKecamatan');
    const curVal = select.value;
    select.innerHTML = '<option value="ALL">Semua Kecamatan</option>';
    
    kecamatanList.forEach(kec => {
      const opt = document.createElement('option');
      opt.value = kec;
      opt.textContent = kec;
      select.appendChild(opt);
    });

    if (curVal && kecamatanList.includes(curVal)) {
      select.value = curVal;
    }
  }

  /**
   * Menyesuaikan teks judul tab, heading tabel, dan tombol toggle sesuai jenjang aktif
   */
  function updateUIForActiveJenjang() {
    const jenjang = getActiveJenjang();
    const jenjangLabel = jenjang === 'SMP' ? 'SMP' : 'SD';

    // 1. Update teks tab navigasi
    const btnTab1 = document.getElementById('tabBtnKebutuhanSD');
    const btnTab2 = document.getElementById('tabBtnKeadaanSD');
    const btnTab3 = document.getElementById('tabBtnPensiunSD');
    if (btnTab1) btnTab1.textContent = `1. Kebutuhan Guru ${jenjangLabel}`;
    if (btnTab2) btnTab2.textContent = `2. Keadaan PTK ${jenjangLabel}`;
    if (btnTab3) btnTab3.textContent = `3. Proyeksi Pensiun PTK ${jenjangLabel}`;

    // 2. Update heading tabel
    const headingTab1 = document.getElementById('headingTab1');
    const headingTab2 = document.getElementById('headingTab2');
    if (headingTab1) headingTab1.textContent = `Tabel Kebutuhan & Kekurangan/Kelebihan Guru ${jenjangLabel}`;
    if (headingTab2) headingTab2.textContent = `Tabel Keadaan PTK Sekolah ${jenjang === 'SMP' ? 'Menengah Pertama (SMP)' : 'Dasar (SD)'}`;

    // 3. Update titles in Tab 2 cards
    const tTotalPTK = document.getElementById('kpiKeadaanTotalPTKTitle');
    const tKS = document.getElementById('kpiKeadaanTotalKSTitle');
    const tGuru = document.getElementById('kpiKeadaanTotalGuruTitle');
    if (tTotalPTK) tTotalPTK.textContent = `Total PTK ${jenjangLabel}`;
    if (tKS) tKS.textContent = `Kepala ${jenjangLabel}`;
    if (tGuru) tGuru.textContent = `Guru ${jenjangLabel}`;

    // 4. Update titles in Tab 3 cards
    const tPensiunKS = document.getElementById('kpiPensiunKsTitle');
    const tPensiunGuru = document.getElementById('kpiPensiunGuruTitle');
    if (tPensiunKS) tPensiunKS.textContent = `Kepala ${jenjangLabel}`;
    if (tPensiunGuru) tPensiunGuru.textContent = `Guru ${jenjangLabel}`;

    // 5. Render ulang toggle bar formasi Tab 1
    renderFormasiToggleButtons();

    // 6. Render ulang toggle bar keadaan Tab 2
    renderKeadaanToggleButtons();
  }

  /**
   * Render Tombol Toggle Formasi Tab 1 Dinamis (SD vs SMP)
   */
  function renderFormasiToggleButtons() {
    const container = document.getElementById('toggleBarFormasi');
    if (!container) return;

    const jenjang = getActiveJenjang();
    const config = (jenjang === 'SMP') ? FORMASI_CONFIG_SMP : FORMASI_CONFIG_SD;
    const list = (jenjang === 'SMP') ? FORMASI_LIST_SMP : FORMASI_LIST_SD;

    // Pastikan activeFormasiToggle valid
    if (activeFormasiToggle !== 'ALL' && activeFormasiToggle !== 'MATRIX' && !config[activeFormasiToggle]) {
      activeFormasiToggle = 'ALL';
    }

    let html = `<button class="toggle-btn ${activeFormasiToggle === 'ALL' ? 'active' : ''}" id="btnTog_ALL" onclick="setFormasiToggle('ALL')">Semua (Total)</button>`;
    
    list.forEach(fKey => {
      const item = config[fKey];
      if (!item) return;
      const isAct = (activeFormasiToggle === fKey);
      html += `<button class="toggle-btn ${isAct ? 'active' : ''}" id="btnTog_${fKey}" onclick="setFormasiToggle('${fKey}')">${escapeHtml(item.short || item.label)}</button>`;
    });

    html += `<button class="toggle-btn ${activeFormasiToggle === 'MATRIX' ? 'active' : ''}" id="btnTog_MATRIX" onclick="setFormasiToggle('MATRIX')">Matriks Semua</button>`;

    container.innerHTML = html;
  }

  /**
   * Render Tombol Toggle Tugas Tab 2 Dinamis (SD vs SMP)
   */
  function renderKeadaanToggleButtons() {
    const container = document.getElementById('toggleBarKeadaan');
    if (!container) return;

    const jenjang = getActiveJenjang();
    const list = (jenjang === 'SMP') ? TUGAS_CONFIG_SMP : TUGAS_CONFIG_SD;

    // Pastikan activeKeadaanRoleToggle valid
    const validKeys = list.map(t => t.key);
    if (!validKeys.includes(activeKeadaanRoleToggle)) {
      activeKeadaanRoleToggle = 'ALL';
    }

    let html = '';
    list.forEach(t => {
      const isAct = (activeKeadaanRoleToggle === t.key);
      html += `<button class="toggle-btn ${isAct ? 'active' : ''}" id="btnKeadaanTog_${t.key}" onclick="setKeadaanRoleToggle('${t.key}')">${escapeHtml(t.label)}</button>`;
    });

    container.innerHTML = html;
  }

  /**
   * Helper: Dapatkan ringkasan Keadaan PTK (SD / SMP) berdasarkan filter kecamatan
   */
  function getFilteredSummaryKeadaan() {
    if (!rawData) return null;
    const jenjang = getActiveJenjang();
    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';
    
    // Jika Semua Kecamatan, gunakan summary bawaan
    if (filterKec === 'ALL') {
      if (jenjang === 'SMP') return rawData.summarySMP || rawData.summary;
      return rawData.summarySD || rawData.summary;
    }

    // Jika filter spesifik per kecamatan, agregasi dari sekolah-sekolah di kecamatan tersebut
    const masterList = (jenjang === 'SMP') ? (rawData.rekapSekolahSMP || []) : (rawData.rekapSekolahSD || []);
    const sekolahList = masterList.filter(s => s.kecamatan === filterKec);
    
    const res = {
      totalSekolah: sekolahList.length,
      totalPTK: 0,
      totalKS: 0,
      totalGuru: 0,
      totalTendik: 0,
      totalCPNS: 0,
      totalPNS: 0,
      totalPPPK: 0,
      totalPW: 0,
      totalNonASN: 0,
      totalNonAsnOld: 0,
      totalNonAsnNew: 0,
      kecamatan: filterKec
    };

    sekolahList.forEach(s => {
      res.totalPTK += (s.ptkCount || 0);
      res.totalKS += (s.ksCount || 0);
      res.totalGuru += (s.guruCount || 0);
      res.totalTendik += (s.tendikCount || 0);
      res.totalCPNS += (s.cpnsCount || 0);
      res.totalPNS += (s.pnsCount || 0);
      res.totalPPPK += (s.pppkCount || 0);
      res.totalPW += (s.pwCount || 0);
      res.totalNonASN += (s.nonAsnCount || 0);
      res.totalNonAsnOld += (s.nonAsnOldCount || 0);
      res.totalNonAsnNew += (s.nonAsnNewCount || 0);
    });

    return res;
  }

  /**
   * Render KPI Cards Umum (Tab 2: Keadaan PTK)
   */
  function renderKPIUmum() {
    const summary = getFilteredSummaryKeadaan();
    if (!summary) return;

    const jenjang = getActiveJenjang();
    const jenjangLabel = jenjang === 'SMP' ? 'SMP' : 'SD';
    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';

    // Baris 1: Total PTK, Kepala Sekolah, Guru, Tenaga Kependidikan
    const elTotal = document.getElementById('kpiKeadaanTotalPTK');
    if (elTotal) elTotal.textContent = formatNumber(summary.totalPTK);

    const elSubSekolah = document.getElementById('kpiKeadaanSubSekolah');
    if (elSubSekolah) {
      if (filterKec === 'ALL') {
        elSubSekolah.textContent = `Mencakup ${formatNumber(summary.totalSekolah)} ${jenjangLabel}`;
      } else {
        elSubSekolah.textContent = `Kec. ${filterKec} (${formatNumber(summary.totalSekolah)} ${jenjangLabel})`;
      }
    }

    const elKS = document.getElementById('kpiKeadaanTotalKS');
    if (elKS) elKS.textContent = formatNumber(summary.totalKS);

    const elGuru = document.getElementById('kpiKeadaanTotalGuru');
    if (elGuru) elGuru.textContent = formatNumber(summary.totalGuru);

    const elTendik = document.getElementById('kpiKeadaanTotalTendik');
    if (elTendik) elTendik.textContent = formatNumber(summary.totalTendik);

    // Baris 2: CPNS, PNS, PPPK, PPPK PW, NON ASN (rincian < & > 3-8-2023)
    const elCPNS = document.getElementById('kpiKeadaanTotalCPNS');
    if (elCPNS) elCPNS.textContent = formatNumber(summary.totalCPNS || 0);

    const elPNS = document.getElementById('kpiKeadaanTotalPNS');
    if (elPNS) elPNS.textContent = formatNumber(summary.totalPNS || 0);

    const elPPPK = document.getElementById('kpiKeadaanTotalPPPK');
    if (elPPPK) elPPPK.textContent = formatNumber(summary.totalPPPK || 0);

    const elPW = document.getElementById('kpiKeadaanTotalPW');
    if (elPW) elPW.textContent = formatNumber(summary.totalPW || 0);

    const elNonASN = document.getElementById('kpiKeadaanTotalNonASN');
    if (elNonASN) elNonASN.textContent = formatNumber(summary.totalNonASN || 0);

    const elNonOld = document.getElementById('kpiKeadaanNonAsnOld');
    if (elNonOld) elNonOld.textContent = `< 3-8-2023: ${formatNumber(summary.totalNonAsnOld || 0)}`;

    const elNonNew = document.getElementById('kpiKeadaanNonAsnNew');
    if (elNonNew) elNonNew.textContent = `> 3-8-2023: ${formatNumber(summary.totalNonAsnNew || 0)}`;
  }

  /**
   * Render KPI Cards Kebutuhan Guru per Jenis PTK (Dinamis SD 6 Cards / SMP 16 Cards)
   */
  function renderCardsFormasi() {
    if (!rawData) return;
    const grid = document.getElementById('kpiFormasiGrid');
    if (!grid) return;

    const jenjang = getActiveJenjang();
    if (jenjang === 'SMP') {
      grid.classList.add('grid-smp');
    } else {
      grid.classList.remove('grid-smp');
    }

    const config = (jenjang === 'SMP') ? FORMASI_CONFIG_SMP : FORMASI_CONFIG_SD;
    const list = (jenjang === 'SMP') ? FORMASI_LIST_SMP : FORMASI_LIST_SD;
    const kebData = (jenjang === 'SMP') ? rawData.kebutuhanSMP : rawData.kebutuhanSD;
    if (!kebData || !kebData.perSekolah) return;

    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';

    // Siapkan wadah agregasi per peran
    const totals = {};
    list.forEach(fKey => {
      totals[fKey] = { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 };
    });

    const sekolahList = (filterKec === 'ALL')
      ? kebData.perSekolah
      : kebData.perSekolah.filter(sd => sd.kecamatan === filterKec);

    sekolahList.forEach(sch => {
      list.forEach(fKey => {
        const propKey = config[fKey].key;
        const src = sch[propKey];
        if (!src) return;
        const target = totals[fKey];
        target.butuh += (src.butuh || 0);
        target.terisi += (((src.cpns || 0) + (src.pns || 0) + (src.pppk || 0) + (src.pw || 0)));
        target.selisih += (src.selisih || 0);
        target.nonAsn += (src.nonAsn || 0);
        target.nonAsnOld += (src.nonAsnOld || 0);
        target.nonAsnNew += (src.nonAsnNew || 0);
      });
    });

    // Generate HTML Cards
    let html = '';
    list.forEach(fKey => {
      const conf = config[fKey];
      const item = totals[fKey];
      const isAct = (activeFormasiToggle === fKey);
      const borderStyle = isAct ? 'style="border: 2px solid var(--primary); cursor: pointer;"' : 'style="cursor: pointer;"';

      html += `
        <div class="kpi-card" onclick="setFormasiToggle('${fKey}')" ${borderStyle} title="Klik untuk filter tabel ke ${escapeHtml(conf.label)}">
          <div class="kpi-card-header">
            <span class="kpi-title" title="${escapeHtml(conf.label)}">${escapeHtml(conf.label)}</span>
            <div class="kpi-icon ${conf.icon || 'icon-blue'}">${conf.emoji || '👥'}</div>
          </div>
          <div class="kpi-value">${renderBadgeSelisihLarge(item.selisih)}</div>
          <div class="kpi-subtitle">
            <div class="formasi-kpi-breakdown">
              <span class="formasi-tag-butuh" title="Jumlah Kebutuhan">Butuh: ${formatNumber(item.butuh)}</span>
              <span class="formasi-tag-terisi" title="Terisi ASN/PPPK PW">Terisi: ${formatNumber(item.terisi)}</span>
            </div>
          </div>
        </div>
      `;
    });

    grid.innerHTML = html;
  }

  function renderBadgeSelisihLarge(val) {
    if (val < 0) return `<span style="color:#dc2626;">${val}</span> <span class="kpi-value-status" style="font-size:0.85rem; font-weight:600; color:#ef4444;">Kurang</span>`;
    if (val === 0) return `<span style="color:#16a34a;">0</span> <span class="kpi-value-status" style="font-size:0.85rem; font-weight:600; color:#22c55e;">Pas</span>`;
    return `<span style="color:#0284c7;">+${val}</span> <span class="kpi-value-status" style="font-size:0.85rem; font-weight:600; color:#0ea5e9;">Lebih</span>`;
  }

  /**
   * Ubah Toggle Jenis PTK untuk Tabel Kebutuhan (SD / SMP)
   */
  function setFormasiToggle(formasiKey) {
    activeFormasiToggle = formasiKey;
    document.querySelectorAll('#toggleBarFormasi .toggle-btn').forEach(btn => btn.classList.remove('active'));
    
    const activeBtn = document.getElementById('btnTog_' + formasiKey);
    if (activeBtn) activeBtn.classList.add('active');

    renderCardsFormasi();
    renderTabKebutuhan();
  }

  /**
   * Handler Perubahan Dropdown Kecamatan di Toolbar
   */
  function onFilterKecamatanChange() {
    const selectedKec = document.getElementById('filterKecamatan').value;
    if (selectedKec === 'ALL') {
      currentKebutuhanMode = 'KECAMATAN';
      currentKeadaanMode = 'KECAMATAN';
    } else {
      currentKebutuhanMode = 'SEKOLAH';
      currentKeadaanMode = 'SEKOLAH';
    }
    applyFilters();
  }

  /**
   * Aksi Drilldown: Klik nama kecamatan untuk melihat sekolah-sekolahnya
   */
  function drillDownToKecamatan(kecamatanName) {
    const selKec = document.getElementById('filterKecamatan');
    selKec.value = kecamatanName;
    currentKebutuhanMode = 'SEKOLAH';
    currentKeadaanMode = 'SEKOLAH';
    renderCardsFormasi();
    renderKPIUmum();
    renderTabKebutuhan();
  }

  /**
   * Tombol Reload Data Kecamatan: kembali ke tampilan awal kecamatan
   */
  function resetToKecamatanView() {
    const selKec = document.getElementById('filterKecamatan');
    selKec.value = 'ALL';
    currentKebutuhanMode = 'KECAMATAN';
    currentKeadaanMode = 'KECAMATAN';
    renderCardsFormasi();
    renderKPIUmum();
    renderTabKebutuhan();
  }

  function renderBadgeSelisih(val) {
    if (val < 0) {
      return `<span style="color:#b91c1c; font-weight:600;">${val}</span>`;
    } else if (val === 0 || !val) {
      return `<span>-</span>`;
    } else {
      return `<span style="color:#0369a1; font-weight:600;">+${val}</span>`;
    }
  }

  function formatNumber(num) {
    if (num === 0 || num === '0' || !num) return '-';
    return Number(num).toLocaleString('id-ID');
  }

   * Toggle Pilihan Peran/Tugas di Tab 2: Keadaan PTK (SD / SMP)
   */
  function setKeadaanRoleToggle(roleKey) {
    activeKeadaanRoleToggle = roleKey;
    document.querySelectorAll('#toggleBarKeadaan .toggle-btn').forEach(btn => btn.classList.remove('active'));

    const activeBtn = document.getElementById('btnKeadaanTog_' + roleKey);
    if (activeBtn) activeBtn.classList.add('active');

    renderTabKeadaan();
  }

   * Drilldown Keadaan PTK ke Sekolah
   */

    const selKec = document.getElementById('filterKecamatan');
    selKec.value = kecamatanName;
    currentKeadaanMode = 'SEKOLAH';
    renderCardsFormasi();
    renderKPIUmum();
    renderTabKeadaan();
  }

    const selKec = document.getElementById('filterKecamatan');

    currentKeadaanMode = 'KECAMATAN';
    renderCardsFormasi();
    renderKPIUmum();
    renderTabKeadaan();

  function viewSchoolDetail(npsn, namaSekolah) {
    const modal = document.getElementById('detailModal');
    const modalName = document.getElementById('modalSchoolName');
    const modalMeta = document.getElementById('modalSchoolMeta');
    const modalLoading = document.getElementById('modalLoading');
    const modalTableWrap = document.getElementById('modalTableWrap');
    const modalTbody = document.getElementById('modalTbody');

    modalName.textContent = namaSekolah;
    modalMeta.textContent = `NPSN: ${npsn}`;
    modalLoading.style.display = 'block';
    modalTableWrap.style.display = 'none';
    modal.style.display = 'flex';

    google.script.run
      .withSuccessHandler(res => {
        modalLoading.style.display = 'none';
        modalTableWrap.style.display = 'block';

        if (!res || !res.pegawai) {
          const errMsg = (res && res.error) ? `<br><small style="color:#ef4444;">${escapeHtml(res.error)}</small>` : '';
          modalTbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding: 24px; color: #ef4444;">Gagal memuat data pegawai.${errMsg}</td></tr>`;
          return;
        }

        let html = '';
        if (res.pegawai.length > 0) {
          res.pegawai.forEach((p, idx) => {
            let statusBadge = `<span class="badge badge-nonasn">${escapeHtml(p.statusNorm)}</span>`;
            const sNormUpper = String(p.statusNorm || '').toUpperCase();
            if (sNormUpper === 'CPNS') {
              statusBadge = `<span class="badge badge-cpns">CPNS</span>`;
            } else if (sNormUpper === 'PNS') {
              statusBadge = `<span class="badge badge-pns">PNS</span>`;
            } else if (sNormUpper === 'PPPK') {
              statusBadge = `<span class="badge badge-pppk">PPPK</span>`;
            } else if (sNormUpper === 'PW') {
              statusBadge = `<span class="badge badge-pw">PW</span>`;
            } else if (sNormUpper === 'NON-ASN' || sNormUpper === 'NON ASN') {
              const badgeClass = p.tmtCategory === 'OLD' ? 'badge-nonasn-old' : 'badge-nonasn-new';
              const labelCategory = p.tmtCategory === 'OLD' ? '< 3-8-23' : '> 3-8-23';
              const tmtInfo = p.tmtFormatted ? ` (${p.tmtFormatted})` : '';
              statusBadge = `<span class="badge ${badgeClass}" title="TMT: ${p.tmtFormatted || '-'}">Non-ASN ${labelCategory}${tmtInfo}</span>`;
            }

            const nipLabel = (p.nip && p.nip !== '-') ? `NIP. ${escapeHtml(p.nip)}` : 'NIP: -';

            html += `
              <tr>
                <td class="text-center">${idx + 1}</td>
                <td class="modal-col-nama">
                  <div style="font-weight: 600; color: var(--secondary);">${escapeHtml(p.nama)}</div>
                  <div style="font-size: 0.74rem; color: #64748b; margin-top: 2px; font-family: monospace;">${nipLabel}</div>
                </td>
                <td class="modal-col-tugas">${escapeHtml(p.tugas || '-')}</td>
                <td class="text-center modal-col-status">${statusBadge}</td>
                <td class="text-center modal-col-pangkat" style="font-weight: 500; color: #334155;">${escapeHtml(p.pangkatGol || '-')}</td>
              </tr>
            `;
          });
        } else {
          html = '<tr><td colspan="5" class="text-center" style="padding: 24px; color: #64748b;">Tidak ada data pegawai terdaftar untuk sekolah ini di database.</td></tr>';
        }
        modalTbody.innerHTML = html;
      })
      .withFailureHandler(err => {
        modalLoading.style.display = 'none';
        modalTbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding: 24px; color: #ef4444;">Terjadi kesalahan sistem: ${escapeHtml(err.message || err)}</td></tr>`;
      })
      .getPTKDetailSekolah(npsn, namaSekolah);
  }

  function cleanTableForExcelExport(originalTable, isSekolahMode) {
    const clone = originalTable.cloneNode(true);

    if (isSekolahMode) {
      const rows = clone.querySelectorAll('tr');
      rows.forEach(row => {
        const lastCell = row.lastElementChild;
        if (lastCell) {
          row.removeChild(lastCell);
        }
      });
    }

    const allRows = clone.querySelectorAll('tr');
    allRows.forEach(row => {
      const cells = row.querySelectorAll('th, td');
      cells.forEach(cell => {
        let txt = cell.textContent.trim();

        if (txt === '-') {
          cell.textContent = '0';
          return;
        }

        const cleanDigitsOnly = txt.replace(/^[+\-]/, '').replace(/[\.,\s]/g, '');
        if (/^\d+$/.test(cleanDigitsOnly)) {
          const isNegative = txt.startsWith('-');
          const numericVal = parseInt(cleanDigitsOnly, 10);
          cell.textContent = String(isNegative ? -numericVal : numericVal);
        }
      });
    });

    return clone;
  }

  /**

  function exportTableKebutuhanSDToExcel() {
    const table = document.getElementById('tableKebutuhanSD');
    if (!table) return;

    const jenjang = getActiveJenjang();
    const jenjangLabel = jenjang === 'SMP' ? 'SMP' : 'SD';
    const config = (jenjang === 'SMP') ? FORMASI_CONFIG_SMP : FORMASI_CONFIG_SD;
    const filterKec = document.getElementById('filterKecamatan').value;

    const activeConf = config[activeFormasiToggle] || config.ALL;
    const fTitle = activeConf.label;
    const isSekolahMode = (currentKebutuhanMode === 'SEKOLAH' && filterKec !== 'ALL');

    const mainTitle = isSekolahMode 
      ? `TABEL KEBUTUHAN & KEKURANGAN/KELEBIHAN GURU ${jenjangLabel} (${fTitle.toUpperCase()}) - KECAMATAN ${filterKec.toUpperCase()}`
      : `TABEL KEBUTUHAN & KEKURANGAN/KELEBIHAN GURU ${jenjangLabel} (${fTitle.toUpperCase()}) - REKAP PER KECAMATAN`;
    
    const subTitle = `Tanggal Ekspor: ${new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}`;

    const cleanTable = cleanTableForExcelExport(table, isSekolahMode);
    const ws = XLSX.utils.table_to_sheet(cleanTable, { origin: "A4", raw: false });

    XLSX.utils.sheet_add_aoa(ws, [
      [mainTitle],
      [subTitle],
      []
    ], { origin: "A1" });

    const fFileSlug = fTitle.replace(/[^A-Za-z0-9]/g, '_');
    const fileName = isSekolahMode 
      ? `Kebutuhan_Guru_${jenjangLabel}_${fFileSlug}_Kecamatan_${filterKec.replace(/\s+/g, '_')}.xlsx`
      : `Kebutuhan_Guru_${jenjangLabel}_${fFileSlug}_Per_Kecamatan.xlsx`;

    const sheetName = isSekolahMode ? filterKec.substring(0, 30) : `Kebutuhan Guru ${jenjangLabel}`;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, fileName);
  }

  /**
   * Render Utama Tab 3: Proyeksi Pensiun (Dinamis SD / SMP)
   */
  function renderTabPensiun() {
    if (!rawData) return;

    const jenjang = getActiveJenjang();
    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';
    const masterPensiun = (jenjang === 'SMP') ? (rawData.pensiunSMP || []) : (rawData.pensiunSD || []);
    let list = masterPensiun.slice();

    // Filter Wilayah Kecamatan (Filter Utama)
    if (filterKec !== 'ALL') {
      list = list.filter(p => p.kecamatan === filterKec);
    }

    renderPensiunYearButtons();

    const yearList = list.filter(p => p.pensiunTahun === selectedPensiunYear);

    const createStatusBreakdown = () => ({ pns: 0, pppk: 0, pw: 0, nonAsn: 0, total: 0 });
    const statKS = createStatusBreakdown();
    const statGuru = createStatusBreakdown();
    const statTendik = createStatusBreakdown();

    yearList.forEach(p => {
      let cat = p.roleCategory;
      if (!cat) {
        cat = p.isGuruKs ? 'GURU' : 'TENDIK';
      }

      let target = statTendik;
      if (cat === 'KS') target = statKS;
      else if (cat === 'GURU') target = statGuru;

      target.total++;
      const s = p.status || 'Non-ASN';
      if (s === 'PNS' || s === 'CPNS') target.pns++;
      else if (s === 'PPPK') target.pppk++;
      else if (s === 'PW') target.pw++;
      else target.nonAsn++;
    });

    const formatBreakdownText = (st) => {
      return `<div class="pensiun-status-breakdown">` +
             `<span class="pensiun-tag-pns" title="PNS">PNS: ${formatNumber(st.pns)}</span>` +
             `<span class="pensiun-tag-pppk" title="PPPK Penuh Waktu">PPPK: ${formatNumber(st.pppk)}</span>` +
             `<span class="pensiun-tag-pw" title="PPPK Paruh Waktu">PW: ${formatNumber(st.pw)}</span>` +
             `<span class="pensiun-tag-nonasn" title="Non ASN">Non ASN: ${formatNumber(st.nonAsn)}</span>` +
             `</div>`;
    };

    const elYearTitle = document.getElementById('kpiPensiunYearTitle');
    const elYearCount = document.getElementById('kpiPensiunYearCount');
    const elYearDetail = document.getElementById('kpiPensiunYearDetail');
    if (elYearTitle) elYearTitle.textContent = `PENSIUN TAHUN ${selectedPensiunYear}`;
    if (elYearCount) elYearCount.textContent = formatNumber(yearList.length);
    if (elYearDetail) elYearDetail.textContent = `KS: ${formatNumber(statKS.total)} | Guru: ${formatNumber(statGuru.total)} | Tendik: ${formatNumber(statTendik.total)}`;

    const elKsCount = document.getElementById('kpiPensiunKsCount');
    const elKsDetail = document.getElementById('kpiPensiunKsDetail');
    if (elKsCount) elKsCount.textContent = formatNumber(statKS.total);
    if (elKsDetail) elKsDetail.innerHTML = formatBreakdownText(statKS);

    const elGuruCount = document.getElementById('kpiPensiunGuruCount');
    const elGuruDetail = document.getElementById('kpiPensiunGuruDetail');
    if (elGuruCount) elGuruCount.textContent = formatNumber(statGuru.total);
    if (elGuruDetail) elGuruDetail.innerHTML = formatBreakdownText(statGuru);

    const elTendikCount = document.getElementById('kpiPensiunTendikCount');
    const elTendikDetail = document.getElementById('kpiPensiunTendikDetail');
    if (elTendikCount) elTendikCount.textContent = formatNumber(statTendik.total);
    if (elTendikDetail) elTendikDetail.innerHTML = formatBreakdownText(statTendik);

    renderPensiunBarChart(yearList);

    const bulanIndo = [
      '', 'JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI',
      'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'
    ];

    const tableList = selectedPensiunMonth !== null 
      ? yearList.filter(p => p.pensiunBulan === selectedPensiunMonth)
      : yearList;

    const elTableHeading = document.getElementById('pensiunTableHeading');
    if (elTableHeading) {
      if (selectedPensiunMonth !== null) {
        elTableHeading.textContent = `Daftar Nama Personil Pensiun - Bulan ${bulanIndo[selectedPensiunMonth]} ${selectedPensiunYear} (${tableList.length} Orang)`;
      } else {
        elTableHeading.textContent = `Daftar Nama Personil Pensiun - Tahun ${selectedPensiunYear} (${tableList.length} Orang)`;
      }
    }

    renderPensiunTable(tableList);
  }

  function renderPensiunYearButtons() {
    const container = document.getElementById('pensiunYearButtons');
    if (!container) return;

    const baseYear = new Date().getFullYear();
    const years = [baseYear, baseYear + 1, baseYear + 2, baseYear + 3, baseYear + 4];

    let html = '';
    years.forEach((yr, idx) => {
      const isAct = yr === selectedPensiunYear;
      let label = yr.toString();
      if (idx === 0) label = `Tahun Ini (${yr})`;
      else if (idx === 1) label = `Tahun Depan (${yr})`;

      html += `<button class="pensiun-year-btn ${isAct ? 'active' : ''}" onclick="setPensiunYear(${yr})">${label}</button>`;
    });

    container.innerHTML = html;
  }

  function renderPensiunBarChart(yearList) {
    const container = document.getElementById('pensiunChartBars');
    const titleEl = document.getElementById('pensiunChartTitle');
    if (titleEl) titleEl.textContent = `TIMELINE PENSIUN PER BULAN (${selectedPensiunYear})`;
    if (!container) return;

    const bulanShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

    const monthlyData = {};
    for (let m = 1; m <= 12; m++) {
      monthlyData[m] = { pns: 0, pppk: 0, pw: 0, nonAsn: 0, total: 0 };
    }

    yearList.forEach(p => {
      const m = p.pensiunBulan;
      if (m >= 1 && m <= 12) {
        monthlyData[m].total++;
        const s = p.status || 'Non-ASN';
        if (s === 'PNS' || s === 'CPNS') monthlyData[m].pns++;
        else if (s === 'PPPK') monthlyData[m].pppk++;
        else if (s === 'PW') monthlyData[m].pw++;
        else monthlyData[m].nonAsn++;
      }
    });

    let maxCount = 1;
    for (let m = 1; m <= 12; m++) {
      if (monthlyData[m].total > maxCount) maxCount = monthlyData[m].total;
    }

    let html = '';
    for (let m = 1; m <= 12; m++) {
      const d = monthlyData[m];
      const isSel = (selectedPensiunMonth === m);
      const barHeightPct = Math.round((d.total / maxCount) * 100);

      const pnsPct = d.total > 0 ? (d.pns / d.total) * 100 : 0;
      const pppkPct = d.total > 0 ? (d.pppk / d.total) * 100 : 0;
      const pwPct = d.total > 0 ? (d.pw / d.total) * 100 : 0;
      const nonAsnPct = d.total > 0 ? (d.nonAsn / d.total) * 100 : 0;

      html += `
        <div class="pensiun-bar-col ${isSel ? 'selected' : ''}" onclick="selectPensiunMonth(${m})" title="Klik untuk filter: ${bulanShort[m-1]} ${selectedPensiunYear} (${d.total} orang)">
          <div class="pensiun-bar-val">${d.total > 0 ? d.total : '-'}</div>
          <div class="pensiun-bar-track">
            ${d.total > 0 ? `
              <div class="pensiun-bar-fill" style="height: ${Math.max(barHeightPct, 12)}%;">
                ${d.pns > 0 ? `<div class="pensiun-bar-segment segment-pns" style="height: ${pnsPct}%;" title="PNS: ${d.pns}"></div>` : ''}
                ${d.pppk > 0 ? `<div class="pensiun-bar-segment segment-pppk" style="height: ${pppkPct}%;" title="PPPK: ${d.pppk}"></div>` : ''}
                ${d.pw > 0 ? `<div class="pensiun-bar-segment segment-pw" style="height: ${pwPct}%;" title="PPPK PW: ${d.pw}"></div>` : ''}
                ${d.nonAsn > 0 ? `<div class="pensiun-bar-segment segment-nonasn" style="height: ${nonAsnPct}%;" title="Non ASN: ${d.nonAsn}"></div>` : ''}
              </div>
            ` : ''}
          </div>
          <div class="pensiun-bar-label">${bulanShort[m-1]}</div>
        </div>
      `;
    }

    container.innerHTML = html;
  }

  function renderPensiunTable(list) {
    const tbody = document.getElementById('tbodyPensiunList');
    if (!tbody) return;

    if (!list || list.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="9" class="text-center" style="padding: 24px; color: var(--text-muted);">
            Tidak ada proyeksi pensiun ASN pada periode/filter ini.
          </td>
        </tr>
      `;
      return;
    }

    list.sort((a, b) => {
      if (a.pensiunBulan !== b.pensiunBulan) return a.pensiunBulan - b.pensiunBulan;
      return a.nama.localeCompare(b.nama);
    });

    let html = '';
    list.forEach((p, idx) => {
      let statusBadge = '';
      const s = p.status || 'Non-ASN';
      if (s === 'PNS' || s === 'CPNS') {
        statusBadge = `<span class="badge" style="background:#fee2e2; color:#991b1b; font-weight:700;">${escapeHtml(s)}</span>`;
      } else if (s === 'PPPK') {
        statusBadge = '<span class="badge" style="background:#dcfce7; color:#166534; font-weight:700;">PPPK</span>';
      } else if (s === 'PW') {
        statusBadge = '<span class="badge" style="background:#f3e8ff; color:#7e22ce; font-weight:700;">PPPK PW</span>';
      } else {
        statusBadge = '<span class="badge" style="background:#fef3c7; color:#92400e; font-weight:700;">Non ASN</span>';
      }

      html += `
        <tr>
          <td class="text-center" style="font-weight: 600;">${idx + 1}</td>
          <td style="font-weight: 700; color: var(--secondary);">${escapeHtml(p.nama)}</td>
          <td style="font-family: monospace; font-size: 0.85rem;">${escapeHtml(p.nip)}</td>
          <td>${escapeHtml(p.unitKerja)}</td>
          <td>${escapeHtml(p.jabatan)}</td>
          <td class="text-center">${statusBadge}</td>
          <td class="text-center">${escapeHtml(p.tglLahir)}</td>
          <td class="text-center" style="font-weight: 700;">${p.bup}</td>
          <td class="text-center" style="font-weight: 700; color: #881337;">${escapeHtml(p.pensiunTmt)}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  function exportTablePensiunSDToExcel() {
    if (!rawData) return;

    const jenjang = getActiveJenjang();
    const jenjangLabel = jenjang === 'SMP' ? 'SMP' : 'SD';
    const filterKec = document.getElementById('filterKecamatan') ? document.getElementById('filterKecamatan').value : 'ALL';
    const masterPensiun = (jenjang === 'SMP') ? (rawData.pensiunSMP || []) : (rawData.pensiunSD || []);
    let list = masterPensiun.slice();

    if (filterKec !== 'ALL') {
      list = list.filter(p => p.kecamatan === filterKec);
    }

    const yearList = list.filter(p => p.pensiunTahun === selectedPensiunYear);
    const tableList = selectedPensiunMonth !== null 
      ? yearList.filter(p => p.pensiunBulan === selectedPensiunMonth)
      : yearList;

    if (!tableList || tableList.length === 0) {
      alert('Tidak ada data pensiun untuk diekspor pada filter ini.');
      return;
    }

    tableList.sort((a, b) => {
      if (a.pensiunBulan !== b.pensiunBulan) return a.pensiunBulan - b.pensiunBulan;
      return a.nama.localeCompare(b.nama);
    });

    const bulanIndo = [
      '', 'JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI',
      'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'
    ];

    const bulanTitle = selectedPensiunMonth !== null ? ` BULAN ${bulanIndo[selectedPensiunMonth]}` : '';
    const mainTitle = `PROYEKSI PENSIUN ${jenjangLabel} NEGERI TAHUN ${selectedPensiunYear}${bulanTitle} - WILAYAH ${filterKec.toUpperCase()}`;
    const subTitle = `Tanggal Ekspor: ${new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}`;

    const headers = ['NO', 'NAMA LENGKAP', 'NIP', 'UNIT KERJA', 'JABATAN', 'STATUS', 'TGL LAHIR', 'BUP', 'PENSIUN'];
    const rows = [];

    tableList.forEach((p, idx) => {
      const nipStr = (p.nip && p.nip !== '-') ? String(p.nip).trim() : '-';
      let statusLabel = p.status || 'Non-ASN';
      if (statusLabel === 'PW') statusLabel = 'PPPK PW';

      rows.push([
        idx + 1,
        p.nama || '-',
        nipStr,
        p.unitKerja || '-',
        p.jabatan || '-',
        statusLabel,
        p.tglLahir || '-',
        p.bup || 60,
        p.pensiunTmt || '-'
      ]);
    });

    const wsData = [
      [mainTitle],
      [subTitle],
      [],
      headers,
      ...rows
    ];

    const ws = XLSX.utils.aoa_to_sheet(wsData);

    if (ws['!ref']) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      for (let R = 4; R <= range.e.r; ++R) {
        const cellAddress = XLSX.utils.encode_cell({ r: R, c: 2 });
        const cell = ws[cellAddress];
        if (cell && cell.v !== undefined && cell.v !== null) {
          const sVal = String(cell.v).trim();
          cell.t = 's';
          cell.v = sVal;
          cell.w = sVal;
          cell.z = '@';
        }
      }
    }

    ws['!cols'] = [
      { wch: 6 },  // NO
      { wch: 36 }, // NAMA LENGKAP
      { wch: 24 }, // NIP
      { wch: 32 }, // UNIT KERJA
      { wch: 28 }, // JABATAN
      { wch: 14 }, // STATUS
      { wch: 14 }, // TGL LAHIR
      { wch: 8 },  // BUP
      { wch: 18 }  // PENSIUN
    ];

    const fileName = `Proyeksi_Pensiun_${jenjangLabel}_${selectedPensiunYear}_${filterKec.replace(/\s+/g, '_')}.xlsx`;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, `Pensiun ${jenjangLabel}`);
    XLSX.writeFile(wb, fileName);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeQuote(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'");
  }
</script>
