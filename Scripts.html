<script>
  // State Global
  let rawData = null;
  let activeTab = 'kebutuhanSD';
  let activeFormasiToggle = 'ALL'; // 'ALL', 'KS', 'GURU_KELAS', 'GURU_PAI', 'GURU_PJOK', 'GURU_KRISTEN', 'GURU_KATOLIK', 'MATRIX'
  let currentKebutuhanMode = 'KECAMATAN'; // 'KECAMATAN' (default) atau 'SEKOLAH' (saat drilldown)

  document.addEventListener('DOMContentLoaded', () => {
    loadDashboardData(false);
  });

  function loadDashboardData(forceRefresh) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(handleDataSuccess)
      .withFailureHandler(handleDataError)
      .getDashboardData(forceRefresh);
  }

  function refreshData(force) {
    loadDashboardData(force);
  }

  function handleDataSuccess(data) {
    rawData = data;
    showLoading(false);

    if (data.lastUpdate) {
      document.getElementById('lastUpdatedBadge').textContent = 'Pembaruan: ' + data.lastUpdate;
    }

    populateKecamatanOptions(data.kecamatanList || []);

    // Render Semua Bagian
    renderKPIUmum(data.summary);
    renderCardsFormasiSD(data.kebutuhanSD);
    renderTabKebutuhanSD();
    renderTabKecamatan(data.rekapKecamatan);
    renderTabJenjang(data.rekapJenjang);
    renderTabSekolah(data.rekapSekolah);
  }

  function handleDataError(err) {
    showLoading(false);
    alert('Gagal mengambil data dari Google Apps Script: ' + (err.message || err));
  }

  function showLoading(show) {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) {
      overlay.style.display = show ? 'flex' : 'none';
    }
  }

  function populateKecamatanOptions(kecamatanList) {
    const select = document.getElementById('filterKecamatan');
    const curVal = select.value;
    select.innerHTML = '<option value="ALL">Semua Kecamatan</option>';
    
    kecamatanList.forEach(kec => {
      const opt = document.createElement('option');
      opt.value = kec;
      opt.textContent = kec;
      select.appendChild(opt);
    });

    if (curVal && kecamatanList.includes(curVal)) {
      select.value = curVal;
    }
  }

  /**
   * Render KPI Cards Umum
   */
  function renderKPIUmum(summary) {
    if (!summary) return;
    document.getElementById('kpiTotalPTK').textContent = formatNumber(summary.totalPTK);
    document.getElementById('kpiSubSekolah').textContent = `Mencakup ${formatNumber(summary.totalSekolah)} Sekolah (SD: ${summary.totalSekolahSD}, SMP: ${summary.totalSekolahSMP})`;

    document.getElementById('kpiTotalGuru').textContent = formatNumber(summary.totalGuru);
    document.getElementById('kpiTotalKS').textContent = formatNumber(summary.totalKS);
    document.getElementById('kpiTotalTendik').textContent = formatNumber(summary.totalTendik);

    document.getElementById('kpiPersenASN').textContent = `${summary.persenASN}%`;
    document.getElementById('kpiSubASN').textContent = `PNS: ${formatNumber(summary.totalPNS)} | PPPK: ${formatNumber(summary.totalPPPK)} | PW: ${formatNumber(summary.totalPW)}`;
  }

  /**
   * Render 6 Card Kebutuhan Guru SD per Jenis PTK
   */
  function renderCardsFormasiSD(kebutuhanSD) {
    if (!kebutuhanSD || !kebutuhanSD.perSekolah) return;

    const totals = {
      ks: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      gk: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      pai: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      pjok: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      kristen: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 },
      katolik: { butuh: 0, terisi: 0, selisih: 0, nonAsn: 0, nonAsnOld: 0, nonAsnNew: 0 }
    };

    kebutuhanSD.perSekolah.forEach(sd => {
      const acc = (target, src) => {
        target.butuh += src.butuh;
        target.terisi += (src.pns + src.pppk + src.pw);
        target.selisih += src.selisih;
        target.nonAsn += src.nonAsn;
        target.nonAsnOld += (src.nonAsnOld || 0);
        target.nonAsnNew += (src.nonAsnNew || 0);
      };

      acc(totals.ks, sd.ks);
      acc(totals.gk, sd.guruKelas);
      acc(totals.pai, sd.guruPai);
      acc(totals.pjok, sd.guruPjok);
      acc(totals.kristen, sd.guruKristen);
      acc(totals.katolik, sd.guruKatolik);
    });

    const setCard = (prefix, item) => {
      const valElem = document.getElementById(prefix + 'Selisih');
      const detElem = document.getElementById(prefix + 'Detail');
      if (valElem) {
        valElem.innerHTML = renderBadgeSelisihLarge(item.selisih);
      }
      if (detElem) {
        detElem.textContent = `Butuh: ${formatNumber(item.butuh)} | Terisi: ${formatNumber(item.terisi)} | Non: ${formatNumber(item.nonAsnOld)} (<) / ${formatNumber(item.nonAsnNew)} (>)`;
      }
    };

    setCard('kpiKs', totals.ks);
    setCard('kpiGk', totals.gk);
    setCard('kpiPai', totals.pai);
    setCard('kpiPjok', totals.pjok);
    setCard('kpiKristen', totals.kristen);
    setCard('kpiKatolik', totals.katolik);
  }

  function renderBadgeSelisihLarge(val) {
    if (val < 0) return `<span style="color:#dc2626;">${val}</span> <span style="font-size:0.9rem; font-weight:600; color:#ef4444;">Kurang</span>`;
    if (val === 0) return `<span style="color:#16a34a;">0</span> <span style="font-size:0.9rem; font-weight:600; color:#22c55e;">Pas</span>`;
    return `<span style="color:#0284c7;">+${val}</span> <span style="font-size:0.9rem; font-weight:600; color:#0ea5e9;">Lebih</span>`;
  }

  /**
   * Ubah Toggle Jenis PTK untuk Tabel Kebutuhan SD
   */
  function setFormasiToggle(formasiKey) {
    activeFormasiToggle = formasiKey;
    document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
    
    const activeBtn = document.getElementById('btnTog_' + formasiKey);
    if (activeBtn) activeBtn.classList.add('active');

    renderTabKebutuhanSD();
  }

  /**
   * Handler Perubahan Dropdown Kecamatan di Toolbar
   */
  function onFilterKecamatanChange() {
    const selectedKec = document.getElementById('filterKecamatan').value;
    if (selectedKec === 'ALL') {
      currentKebutuhanMode = 'KECAMATAN';
    } else {
      currentKebutuhanMode = 'SEKOLAH';
    }
    applyFilters();
  }

  /**
   * Aksi Drilldown: Klik nama kecamatan untuk melihat sekolah-sekolahnya
   */
  function drillDownToKecamatan(kecamatanName) {
    const selKec = document.getElementById('filterKecamatan');
    selKec.value = kecamatanName;
    currentKebutuhanMode = 'SEKOLAH';
    renderTabKebutuhanSD();
  }

  /**
   * Tombol Reload Data Kecamatan: kembali ke tampilan awal kecamatan
   */
  function resetToKecamatanView() {
    const selKec = document.getElementById('filterKecamatan');
    selKec.value = 'ALL';
    currentKebutuhanMode = 'KECAMATAN';
    renderTabKebutuhanSD();
  }

  /**
   * TAB 1: Render Kebutuhan Guru SD
   */
  function renderTabKebutuhanSD() {
    if (!rawData || !rawData.kebutuhanSD) return;

    const thead = document.getElementById('theadKebutuhanSD');
    const tbody = document.getElementById('tbodyKebutuhanSD');
    const tfoot = document.getElementById('tfootKebutuhanSD');
    const breadcrumbWrap = document.getElementById('breadcrumbWrap');

    const filterKec = document.getElementById('filterKecamatan').value;
    const filterStatus = document.getElementById('filterStatusKebutuhan').value;
    const searchEl = document.getElementById('searchSekolah');
    const searchVal = searchEl ? searchEl.value.toLowerCase().trim() : '';

    // Kamus Label Formasi
    const formasiConfig = {
      'ALL': { key: 'total', label: 'TOTAL SELURUH GURU SD' },
      'KS': { key: 'ks', label: 'Kepala Sekolah' },
      'GURU_KELAS': { key: 'guruKelas', label: 'Guru Kelas' },
      'GURU_PAI': { key: 'guruPai', label: 'Guru PAI' },
      'GURU_PJOK': { key: 'guruPjok', label: 'Guru PJOK' },
      'GURU_KRISTEN': { key: 'guruKristen', label: 'Guru PA Kristen' },
      'GURU_KATOLIK': { key: 'guruKatolik', label: 'Guru PA Katolik' }
    };

    const activeConf = formasiConfig[activeFormasiToggle] || formasiConfig.ALL;
    const fKey = activeConf.key;

    // -------------------------------------------------------------
    // KONDISI A: TAMPILAN PER KECAMATAN (DEFAULT)
    // -------------------------------------------------------------
    if (currentKebutuhanMode === 'KECAMATAN') {
      breadcrumbWrap.style.display = 'none'; // Sembunyikan badge/breadcrumb

      let list = (rawData.kebutuhanSD.perKecamatan || []).slice();

      // Filter Status
      if (filterStatus !== 'ALL') {
        list = list.filter(k => {
          let targetEval = k.total;
          if (activeFormasiToggle !== 'ALL' && activeFormasiToggle !== 'MATRIX') {
            if (k[fKey]) targetEval = k[fKey];
          }
          if (filterStatus === 'KURANG' && targetEval.selisih >= 0) return false;
          if (filterStatus === 'PAS' && targetEval.selisih !== 0) return false;
          if (filterStatus === 'LEBIH' && targetEval.selisih <= 0) return false;
          return true;
        });
      }

      // Filter Pencarian jika diisi
      if (searchVal) {
        list = list.filter(k => k.kecamatan && k.kecamatan.toLowerCase().includes(searchVal));
      }

      // SORTING: Kekurangan terbanyak (selisih paling minus) di baris paling atas
      list.sort((a, b) => {
        const valA = (activeFormasiToggle === 'ALL' || activeFormasiToggle === 'MATRIX') ? a.total.selisih : (a[fKey] ? a[fKey].selisih : 0);
        const valB = (activeFormasiToggle === 'ALL' || activeFormasiToggle === 'MATRIX') ? b.total.selisih : (b[fKey] ? b[fKey].selisih : 0);
        return valA - valB;
      });

      if (activeFormasiToggle === 'MATRIX') {
        // Matriks Semua Formasi per Kecamatan
        thead.innerHTML = `
          <tr>
            <th rowspan="2" class="text-center" style="vertical-align: middle;">No</th>
            <th rowspan="2" style="vertical-align: middle;">Kecamatan</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>SD</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Murid</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Rombel</th>
            <th colspan="3" class="text-center mat-ks">Kepala Sekolah</th>
            <th colspan="3" class="text-center mat-kel">Guru Kelas</th>
            <th colspan="3" class="text-center mat-pai">Guru PAI</th>
            <th colspan="3" class="text-center mat-pjok">Guru PJOK</th>
            <th colspan="3" class="text-center mat-kri">Guru Kristen</th>
            <th colspan="3" class="text-center mat-kat">Guru Katolik</th>
            <th colspan="7" class="text-center mat-tot">TOTAL GURU SD</th>
          </tr>
          <tr>
            <th class="text-center mat-ks">Bth</th><th class="text-center mat-ks">Ada</th><th class="text-center mat-ks">+/-</th>
            <th class="text-center mat-kel">Bth</th><th class="text-center mat-kel">Ada</th><th class="text-center mat-kel">+/-</th>
            <th class="text-center mat-pai">Bth</th><th class="text-center mat-pai">Ada</th><th class="text-center mat-pai">+/-</th>
            <th class="text-center mat-pjok">Bth</th><th class="text-center mat-pjok">Ada</th><th class="text-center mat-pjok">+/-</th>
            <th class="text-center mat-kri">Bth</th><th class="text-center mat-kri">Ada</th><th class="text-center mat-kri">+/-</th>
            <th class="text-center mat-kat">Bth</th><th class="text-center mat-kat">Ada</th><th class="text-center mat-kat">+/-</th>
            <th class="text-center mat-tot-bth">Butuh</th>
            <th class="text-center mat-tot">PNS</th>
            <th class="text-center mat-tot">PPPK</th>
            <th class="text-center mat-tot">PW</th>
            <th class="text-center mat-tot-sel">+/-</th>
            <th class="text-center mat-tot" style="line-height:1.2;">Non-ASN<br>&lt; 3-8-23</th>
            <th class="text-center mat-tot" style="line-height:1.2;">Non-ASN<br>&gt; 3-8-23</th>
          </tr>
        `;

        let html = '';
        let totSekolah = 0, totMurid = 0, totRombel = 0, totBth = 0, totPns = 0, totPppk = 0, totPw = 0, totSelisih = 0, totNonOld = 0, totNonNew = 0;

        list.forEach((k, idx) => {
          totSekolah += k.jmlSekolah;
          totMurid += (k.totalMurid || 0);
          totRombel += k.totalRombel;
          totBth += k.total.butuh;
          totPns += k.total.pns;
          totPppk += k.total.pppk;
          totPw += k.total.pw;
          totSelisih += k.total.selisih;
          totNonOld += (k.total.nonAsnOld || 0);
          totNonNew += (k.total.nonAsnNew || 0);

          const renderKecFormasi = (f, cls) => `
            <td class="text-center ${cls}">${formatNumber(f.butuh)}</td>
            <td class="text-center ${cls}">${formatNumber(f.pns + f.pppk + f.pw)}</td>
            <td class="text-center ${cls}">${renderBadgeSelisih(f.selisih)}</td>
          `;

          html += `
            <tr class="clickable-row" onclick="drillDownToKecamatan('${escapeQuote(k.kecamatan)}')" title="Klik untuk melihat sekolah-sekolah di Kec. ${escapeHtml(k.kecamatan)}">
              <td class="text-center">${idx + 1}</td>
              <td>${escapeHtml(k.kecamatan)}</td>
              <td class="text-center">${formatNumber(k.jmlSekolah)}</td>
              <td class="text-center">${formatNumber(k.totalMurid || 0)}</td>
              <td class="text-center">${formatNumber(k.totalRombel)}</td>
              ${renderKecFormasi(k.ks, 'mat-ks')}
              ${renderKecFormasi(k.guruKelas, 'mat-kel')}
              ${renderKecFormasi(k.guruPai, 'mat-pai')}
              ${renderKecFormasi(k.guruPjok, 'mat-pjok')}
              ${renderKecFormasi(k.guruKristen, 'mat-kri')}
              ${renderKecFormasi(k.guruKatolik, 'mat-kat')}
              <td class="text-center mat-tot-bth">${formatNumber(k.total.butuh)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.pns)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.pppk)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.pw)}</td>
              <td class="text-center mat-tot-sel">${renderBadgeSelisih(k.total.selisih)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.nonAsnOld)}</td>
              <td class="text-center mat-tot">${formatNumber(k.total.nonAsnNew)}</td>
            </tr>
          `;
        });

        tbody.innerHTML = html || '<tr><td colspan="30" class="text-center" style="padding: 24px;">Tidak ada data kecamatan.</td></tr>';
        tfoot.innerHTML = `
          <tr>
            <th colspan="2" class="text-center">TOTAL KESELURUHAN</th>
            <th class="text-center">${formatNumber(totSekolah)}</th>
            <th class="text-center">${formatNumber(totMurid)}</th>
            <th class="text-center">${formatNumber(totRombel)}</th>
            <th colspan="18" class="text-center" style="color:#64748b;">- Akumulasi Seluruh Formasi Tertera di Kolom Total -</th>
            <th class="text-center mat-tot-bth">${formatNumber(totBth)}</th>
            <th class="text-center mat-tot">${formatNumber(totPns)}</th>
            <th class="text-center mat-tot">${formatNumber(totPppk)}</th>
            <th class="text-center mat-tot">${formatNumber(totPw)}</th>
            <th class="text-center mat-tot-sel">${renderBadgeSelisih(totSelisih)}</th>
            <th class="text-center mat-tot">${formatNumber(totNonOld)}</th>
            <th class="text-center mat-tot">${formatNumber(totNonNew)}</th>
          </tr>
        `;

      } else {
        // Tampilan Ringkas & Fokus per Kecamatan dengan Header Bertingkat
        thead.innerHTML = `
          <tr>
            <th rowspan="2" class="text-center" style="width: 48px; vertical-align: middle;">No</th>
            <th rowspan="2" style="vertical-align: middle;">Kecamatan</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>SD</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Murid</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Jumlah<br>Rombel</th>
            <th rowspan="2" class="text-center col-kebutuhan" style="vertical-align: middle;">Kebutuhan</th>
            <th colspan="4" class="text-center col-keadaan" style="border-bottom: 1px solid var(--border-color);">Keadaan</th>
            <th rowspan="2" class="text-center col-selisih" style="vertical-align: middle;">+/-</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Non-ASN<br>&lt; 3-8-2023</th>
            <th rowspan="2" class="text-center" style="vertical-align: middle; line-height: 1.2;">Non-ASN<br>&gt; 3-8-2023</th>
          </tr>
          <tr>
            <th class="text-center col-keadaan">PNS</th>
            <th class="text-center col-keadaan">PPPK</th>
            <th class="text-center col-keadaan">PW</th>
            <th class="text-center col-keadaan-total">Jumlah</th>
          </tr>
        `;

        let html = '';
        let totSekolah = 0, totMurid = 0, totRombel = 0, totBth = 0, totPns = 0, totPppk = 0, totPw = 0, totTerisi = 0, totSelisih = 0, totNonOld = 0, totNonNew = 0;

        list.forEach((k, idx) => {
          const f = k[fKey];
          const terisi = f.pns + f.pppk + f.pw;

          totSekolah += k.jmlSekolah;
          totMurid += (k.totalMurid || 0);
          totRombel += k.totalRombel;
          totBth += f.butuh;
          totPns += f.pns;
          totPppk += f.pppk;
          totPw += f.pw;
          totTerisi += terisi;
          totSelisih += f.selisih;
          totNonOld += (f.nonAsnOld || 0);
          totNonNew += (f.nonAsnNew || 0);

          html += `
            <tr class="clickable-row" onclick="drillDownToKecamatan('${escapeQuote(k.kecamatan)}')" title="Klik untuk melihat sekolah-sekolah di Kec. ${escapeHtml(k.kecamatan)}">
              <td class="text-center">${idx + 1}</td>
              <td>${escapeHtml(k.kecamatan)}</td>
              <td class="text-center">${formatNumber(k.jmlSekolah)}</td>
              <td class="text-center">${formatNumber(k.totalMurid || 0)}</td>
              <td class="text-center">${formatNumber(k.totalRombel)}</td>
              <td class="text-center col-kebutuhan">${formatNumber(f.butuh)}</td>
              <td class="text-center col-keadaan">${formatNumber(f.pns)}</td>
              <td class="text-center col-keadaan">${formatNumber(f.pppk)}</td>
              <td class="text-center col-keadaan">${formatNumber(f.pw)}</td>
              <td class="text-center col-keadaan-total">${formatNumber(terisi)}</td>
              <td class="text-center col-selisih">${renderBadgeSelisih(f.selisih)}</td>
              <td class="text-center col-nonasn">${formatNumber(f.nonAsnOld)}</td>
              <td class="text-center col-nonasn">${formatNumber(f.nonAsnNew)}</td>
            </tr>
          `;
        });

        tbody.innerHTML = html || `<tr><td colspan="13" class="text-center" style="padding: 24px;">Tidak ada data kecamatan untuk formasi <strong>${escapeHtml(activeConf.label)}</strong></td></tr>`;
        tfoot.innerHTML = `
          <tr>
            <th colspan="2" class="text-center">TOTAL KESELURUHAN</th>
            <th class="text-center">${formatNumber(totSekolah)}</th>
            <th class="text-center">${formatNumber(totMurid)}</th>
            <th class="text-center">${formatNumber(totRombel)}</th>
            <th class="text-center col-kebutuhan">${formatNumber(totBth)}</th>
            <th class="text-center col-keadaan">${formatNumber(totPns)}</th>
            <th class="text-center col-keadaan">${formatNumber(totPppk)}</th>
            <th class="text-center col-keadaan">${formatNumber(totPw)}</th>
            <th class="text-center col-keadaan-total">${formatNumber(totTerisi)}</th>
            <th class="text-center col-selisih">${renderBadgeSelisih(totSelisih)}</th>
            <th class="text-center col-nonasn">${formatNumber(totNonOld)}</th>
            <th class="text-center col-nonasn">${formatNumber(totNonNew)}</th>
          </tr>
        `;
      }

    } 
    // -------------------------------------------------------------
    // KONDISI B: TAMPILAN PER SEKOLAH DALAM 1 KECAMATAN TERPILIH
    // -------------------------------------------------------------
    else {
      breadcrumbWrap.style.display = 'flex';
      breadcrumbWrap.innerHTML = `
        <a class="breadcrumb-link" onclick="resetToKecamatanView()">⬅️ Kembali ke Data Kecamatan</a>
        <span>&gt;</span>
        <span class="breadcrumb-current">Sekolah di Kecamatan: <strong>${escapeHtml(filterKec)}</strong></span>
      `;

      let list = (rawData.kebutuhanSD.perSekolah || []).slice();

      // Filter Data per Kecamatan terpilih
      let filtered = list.filter(item => {
        if (filterKec !== 'ALL' && item.kecamatan !== filterKec) return false;
        if (searchVal) {
          const matchName = item.namaSekolah && item.namaSekolah.toLowerCase().includes(searchVal);
          const matchNpsn = item.npsn && item.npsn.toLowerCase().includes(searchVal);
          if (!matchName && !matchNpsn) return false;
        }

        let targetEval = item.total;
        if (activeFormasiToggle !== 'ALL' && activeFormasiToggle !== 'MATRIX') {
          if (item[fKey]) targetEval = item[fKey];
        }

        if (filterStatus === 'KURANG' && targetEval.selisih >= 0) return false;
        if (filterStatus === 'PAS' && targetEval.selisih !== 0) return false;
        if (filterStatus === 'LEBIH' && targetEval.selisih <= 0) return false;
        return true;
      });

      // SORTING: Sekolah dengan kekurangan terbanyak di baris atas
      filtered.sort((a, b) => {
        const valA = (activeFormasiToggle === 'ALL' || activeFormasiToggle === 'MATRIX') ? a.total.selisih : (a[fKey] ? a[fKey].selisih : 0);
        const valB = (activeFormasiToggle === 'ALL' || activeFormasiToggle === 'MATRIX') ? b.total.selisih : (b[fKey] ? b[fKey].selisih : 0);
        return valA - valB;
      });

  function renderBadgeSelisih(val) {
    if (val < 0) {
      return `<span style="color:#b91c1c;">${val}</span>`;
    } else if (val === 0 || !val) {
      return `<span>-</span>`;
    } else {
      return `<span style="color:#0369a1;">+${val}</span>`;
    }
  }

  function formatNumber(num) {
    if (num === 0 || num === '0' || !num) return '-';
    return Number(num).toLocaleString('id-ID');
  }

      if (filterJenjang !== 'ALL' && sch.jenjang !== filterJenjang) return false;

  function switchTab(tabKey) {
    activeTab = tabKey;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

    const wrapFilterStatus = document.getElementById('wrapFilterStatusKebutuhan');
    const wrapFilterJenjang = document.getElementById('wrapFilterJenjang');

    if (tabKey === 'kebutuhanSD') {
      document.getElementById('tabBtnKebutuhanSD').classList.add('active');
      document.getElementById('tabKebutuhanSD').classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'flex';
      if (wrapFilterJenjang) wrapFilterJenjang.style.display = 'none';
    } else if (tabKey === 'kecamatan') {
      document.getElementById('tabBtnKecamatan').classList.add('active');
      document.getElementById('tabKecamatan').classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'none';
      if (wrapFilterJenjang) wrapFilterJenjang.style.display = 'flex';
    } else if (tabKey === 'jenjang') {
      document.getElementById('tabBtnJenjang').classList.add('active');
      document.getElementById('tabJenjang').classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'none';
      if (wrapFilterJenjang) wrapFilterJenjang.style.display = 'flex';
    } else if (tabKey === 'sekolah') {
      document.getElementById('tabBtnSekolah').classList.add('active');
      document.getElementById('tabSekolah').classList.add('active');
      if (wrapFilterStatus) wrapFilterStatus.style.display = 'none';
      if (wrapFilterJenjang) wrapFilterJenjang.style.display = 'flex';
    }
  }

  function viewSchoolDetail(npsn, namaSekolah) {
    const modal = document.getElementById('detailModal');
    const modalName = document.getElementById('modalSchoolName');
    const modalMeta = document.getElementById('modalSchoolMeta');
    const modalLoading = document.getElementById('modalLoading');
    const modalTableWrap = document.getElementById('modalTableWrap');
    const modalTbody = document.getElementById('modalTbody');

    modalName.textContent = namaSekolah;
    modalMeta.textContent = `NPSN: ${npsn}`;
    modalLoading.style.display = 'block';
    modalTableWrap.style.display = 'none';
    modal.style.display = 'flex';

    google.script.run
      .withSuccessHandler(res => {
        modalLoading.style.display = 'none';
        modalTableWrap.style.display = 'block';

        if (!res || !res.pegawai) {
          const errMsg = (res && res.error) ? `<br><small style="color:#ef4444;">${escapeHtml(res.error)}</small>` : '';
          modalTbody.innerHTML = `<tr><td colspan="5" class="text-center" style="padding: 24px; color: #ef4444;">Gagal memuat data pegawai.${errMsg}</td></tr>`;
          return;
        }

        let html = '';
        if (res.pegawai.length > 0) {
          res.pegawai.forEach((p, idx) => {
            let statusBadge = `<span class="badge badge-nonasn">${escapeHtml(p.statusNorm)}</span>`;
            const sNormUpper = String(p.statusNorm || '').toUpperCase();
            if (sNormUpper === 'PNS') {
              statusBadge = `<span class="badge badge-pns">PNS</span>`;
            } else if (sNormUpper === 'PPPK') {
              statusBadge = `<span class="badge badge-pppk">PPPK</span>`;
            } else if (sNormUpper === 'PW') {
              statusBadge = `<span class="badge badge-pw">PW</span>`;
            } else if (sNormUpper === 'NON-ASN' || sNormUpper === 'NON ASN') {
              const badgeClass = p.tmtCategory === 'OLD' ? 'badge-nonasn-old' : 'badge-nonasn-new';
              const labelCategory = p.tmtCategory === 'OLD' ? '< 3-8-23' : '> 3-8-23';
              const tmtInfo = p.tmtFormatted ? ` (${p.tmtFormatted})` : '';
              statusBadge = `<span class="badge ${badgeClass}" title="TMT: ${p.tmtFormatted || '-'}">Non-ASN ${labelCategory}${tmtInfo}</span>`;
            }

            html += `
              <tr>
                <td class="text-center">${idx + 1}</td>
                <td><strong>${escapeHtml(p.nama)}</strong></td>
                <td>${escapeHtml(p.tugas || '-')}</td>
                <td class="text-center">${statusBadge}</td>
                <td class="text-center"><span class="badge ${p.jenjang === 'SD' ? 'badge-sd' : 'badge-smp'}">${p.jenjang}</span></td>
              </tr>
            `;
          });
        } else {
          html = '<tr><td colspan="5" class="text-center" style="padding: 24px; color: #64748b;">Tidak ada data pegawai terdaftar untuk sekolah ini di database.</td></tr>';
        }
        modalTbody.innerHTML = html;
      })
      .withFailureHandler(err => {
        modalLoading.style.display = 'none';
        alert('Gagal mengambil rincian pegawai: ' + (err && err.message ? err.message : err));
      })
      .getPTKDetailSekolah(npsn, namaSekolah);
  }

  function closeModal() {
    document.getElementById('detailModal').style.display = 'none';
  }

  function closeModalOnBackdrop(e) {
    if (e.target.id === 'detailModal') closeModal();
  }

  /**
   * Ekspor Khusus Tabel Kebutuhan & Kekurangan Guru SD
   */
  function exportTableKebutuhanSDToExcel() {
    const table = document.getElementById('tableKebutuhanSD');
    if (!table) return;

    const filterKec = document.getElementById('filterKecamatan').value;
    const formasiLabelMap = {
      'ALL': 'Semua_Guru_SD',
      'KS': 'Kepala_Sekolah',
      'GURU_KELAS': 'Guru_Kelas',
      'GURU_PAI': 'Guru_PAI',
      'GURU_PJOK': 'Guru_PJOK',
      'GURU_KRISTEN': 'Guru_PA_Kristen',
      'GURU_KATOLIK': 'Guru_PA_Katolik',
      'MATRIX': 'Matriks_Semua'
    };
    const fLabel = formasiLabelMap[activeFormasiToggle] || activeFormasiToggle;

    let fileName = '';
    if (currentKebutuhanMode === 'SEKOLAH' && filterKec !== 'ALL') {
      fileName = `Kebutuhan_Guru_SD_${fLabel}_Kecamatan_${filterKec.replace(/\s+/g, '_')}.xlsx`;
    } else {
      fileName = `Kebutuhan_Guru_SD_${fLabel}_Per_Kecamatan.xlsx`;
    }

    const sheetName = (currentKebutuhanMode === 'SEKOLAH' && filterKec !== 'ALL') ? filterKec.substring(0, 30) : "Kebutuhan SD";
    const wb = XLSX.utils.table_to_book(table, { sheet: sheetName });
    XLSX.writeFile(wb, fileName);
  }

  function exportActiveTabToExcel() {
    if (activeTab === 'kebutuhanSD') {
      exportTableKebutuhanSDToExcel();
      return;
    }

    let tableId = 'tableKecamatan';
    let fileName = 'Rekap_PTK_Kecamatan.xlsx';

    if (activeTab === 'jenjang') {
      tableId = 'tableJenjang';
      fileName = 'Rekap_PTK_Jenjang.xlsx';
    } else if (activeTab === 'sekolah') {
      tableId = 'tableSekolah';
      fileName = 'Rekap_PTK_Per_Sekolah.xlsx';
    }

    const table = document.getElementById(tableId);
    if (!table) return;

    const wb = XLSX.utils.table_to_book(table, { sheet: "Data" });
    XLSX.writeFile(wb, fileName);
  }


  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeQuote(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'");
  }
</script>
