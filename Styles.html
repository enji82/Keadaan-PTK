<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #0f172a;
    --accent: #f59e0b;
    --success: #10b981;
    --info: #06b6d4;
    --danger: #ef4444;
    --warning: #f59e0b;
    
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius-md: 10px;
    --radius-lg: 16px;
    --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 60px;
  }

  .container { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

  /* Navbar */
  .navbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    padding: 16px 0;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-sm);
  }

  .navbar-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 22px;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
  }
  .brand-text h1 { font-size: 1.25rem; font-weight: 700; color: var(--secondary); letter-spacing: -0.02em; }
  .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

  .nav-actions { display: flex; align-items: center; gap: 10px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .btn-primary { background-color: var(--primary); color: white; }
  .btn-primary:hover { background-color: var(--primary-hover); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
  .btn-secondary { background-color: #ffffff; color: var(--text-main); border-color: var(--border-color); }
  .btn-secondary:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
  .btn-success { background-color: var(--success); color: white; }
  .btn-success:hover { background-color: #059669; }

  /* Section Title */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 0 12px 0;
  }
  .section-header h2 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Filters Toolbar */
  .filters-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin: 24px 0 20px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }

  .filters-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }

  .filter-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-item label {
    font-size: 0.73rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .form-select, .form-input {
    padding: 8px 12px;
    font-size: 0.86rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background-color: #fff;
    color: var(--text-main);
    min-width: 170px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-select:focus, .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .kpi-grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }

  .kpi-grid-5 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  @media (max-width: 1024px) {
    .kpi-grid-4 {
      grid-template-columns: repeat(2, 1fr);
    }
    .kpi-grid-5 {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 640px) {
    .kpi-grid-4,
    .kpi-grid-5 {
      grid-template-columns: 1fr;
    }
  }

  .kpi-subdetail-tags {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 3px;
    font-size: 0.68rem;
    font-weight: 600;
  }

  .kpi-tag-old {
    background: #e0f2fe;
    color: #0369a1;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid #bae6fd;
    white-space: nowrap;
  }

  .kpi-tag-new {
    background: #fef3c7;
    color: #92400e;
    padding: 1px 5px;
    border-radius: 4px;
    border: 1px solid #fde68a;
    white-space: nowrap;
  }

  /* Badge Tags untuk Tab 1 Kebutuhan Guru */
  .formasi-kpi-breakdown {
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 3px;
    font-size: 0.68rem;
    font-weight: 600;
    flex-wrap: wrap;
  }

  .formasi-tag-butuh {
    background: #e0f2fe;
    color: #0369a1;
    padding: 1px 4px;
    border-radius: 4px;
    border: 1px solid #bae6fd;
    font-size: 0.65rem;
    white-space: nowrap;
    line-height: 1.2;
  }

  .formasi-tag-terisi {
    background: #dcfce7;
    color: #166534;
    padding: 1px 4px;
    border-radius: 4px;
    border: 1px solid #bbf7d0;
    font-size: 0.65rem;
    white-space: nowrap;
    line-height: 1.2;
  }

  /* KPI Grid Khusus Kebutuhan Formasi SD & SMP */
  .kpi-formasi-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  @media (max-width: 1100px) {
    .kpi-formasi-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  @media (max-width: 640px) {
    .kpi-formasi-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  /* Khusus Jenjang SMP: 8 Card per Baris (Tepat 2 Baris untuk 16 Card) */
  .kpi-formasi-grid.grid-smp {
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  @media (max-width: 1300px) {
    .kpi-formasi-grid.grid-smp {
      grid-template-columns: repeat(4, 1fr);
    }
  }
  @media (max-width: 768px) {
    .kpi-formasi-grid.grid-smp {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  /* Standarisasi Desain KPI Card di Seluruh Tab (Compact, Sleek, Proporsional) */
  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 10px 12px 8px 12px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    min-width: 0;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

  .kpi-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    gap: 4px;
  }
  .kpi-title {
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kpi-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    flex-shrink: 0;
  }

  .icon-blue { background: #dbeafe; color: #1d4ed8; }
  .icon-green { background: #dcfce7; color: #15803d; }
  .icon-purple { background: #f3e8ff; color: #7e22ce; }
  .icon-amber { background: #fef3c7; color: #b45309; }
  .icon-cyan { background: #cffafe; color: #0e7490; }
  .icon-rose { background: #ffe4e6; color: #be123c; }

  .kpi-value {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--secondary);
    line-height: 1.15;
    margin-bottom: 2px;
  }
  .kpi-value-status {
    font-size: 0.72rem !important;
  }
  .kpi-subtitle {
    font-size: 0.70rem;
    color: var(--text-muted);
    line-height: 1.2;
  }

  /* Breadcrumb Navigation untuk Drilldown */
  .breadcrumb-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    background: #f1f5f9;
    padding: 8px 14px;
    border-radius: 8px;
    width: fit-content;
  }
  .breadcrumb-link {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }
  .breadcrumb-link:hover { text-decoration: underline; }
  .breadcrumb-current { font-weight: 700; color: var(--secondary); }

  /* Pill Toggle Button Bar untuk Formasi & Tugas */
  .toggle-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: #f1f5f9;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
  .toggle-btn {
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    border: none;
    background: transparent;
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .toggle-btn:hover {
    color: var(--primary);
    background: #ffffff;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
  }

  /* Tabs Navigasi */
  .tabs-nav {
    display: flex;
    border-bottom: 2px solid var(--border-color);
    gap: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 12px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text-muted);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn:hover { color: var(--primary); }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  .tab-pane { display: none; animation: fadeIn 0.3s ease; }
  .tab-pane.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card Tables */
  .card-table {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .card-header-bar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .card-header-bar h2 { font-size: 1.05rem; font-weight: 700; color: var(--secondary); }

  .table-responsive { width: 100%; overflow-x: auto; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.825rem; /* ~13.2px, standar dashboard profesional */
    text-align: left;
    font-feature-settings: "tnum", "zero";
    font-variant-numeric: tabular-nums;
  }

  table.data-table th {
    background-color: #f8fafc;
    color: #475569;
    font-weight: 600;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-color);
    border-right: 1px solid #edf2f7;
    white-space: nowrap;
    line-height: 1.3;
  }

  /* Garis pemisah bawah header yang tebal dan seragam untuk seluruh kolom */
  table.data-table thead tr:last-child th,
  table.data-table thead th[rowspan="2"] {
    border-bottom: 2px solid #cbd5e1 !important; /* Tebal 2px solid slate seragam */
  }

  table.data-table td {
    padding: 9px 12px;
    border-bottom: 1px solid #f1f5f9;
    border-right: 1px solid #f8fafc;
    color: #334155;
    font-size: 0.825rem;
    font-weight: 400;
    line-height: 1.4;
    white-space: nowrap; /* Kolom angka/status/wilayah otomatis ringkas menyesuaikan isi */
  }

  /* Kolom Nama Sekolah Dinamis & Proporsional */
  table.data-table th.th-sekolah,
  table.data-table td.col-sekolah {
    white-space: normal !important; /* Memungkinkan teks nama sekolah tertata rapi */
    min-width: 260px; /* Batas minimum nyaman agar nama sekolah tidak melipat ke 3 baris */
    max-width: 380px;
    word-break: break-word;
  }

  table.data-table td.col-sekolah div:first-child {
    font-size: 0.84rem;
    line-height: 1.35;
  }

  table.data-table tfoot th {
    background-color: #f8fafc;
    font-weight: 400; /* disamakan dengan isi baris td agar rapi dan seragam */
    font-size: 0.825rem; /* disamakan dengan ukuran 0.825rem baris data */
    color: #1e293b;
    padding: 9px 12px;
    border-top: 2px solid #cbd5e1 !important; /* Tebal 2px solid slate seragam dengan garis bawah header */
    border-bottom: 2px solid #cbd5e1 !important; /* Batas bawah footer penutup tabel */
    letter-spacing: normal;
  }

  /* Pewarnaan Khusus Zona Kolom Kebutuhan, Keadaan, dan +/- */
  th.col-kebutuhan, td.col-kebutuhan {
    background-color: #dbeafe; /* Soft Blue */
    color: #1e3a8a;
  }
  th.col-kebutuhan {
    font-weight: 700;
  }

  th.col-keadaan, td.col-keadaan {
    background-color: #f1f5f9; /* Soft Slate Gray */
    color: #1e293b;
  }
  th.col-keadaan-total, td.col-keadaan-total {
    background-color: #e2e8f0; /* Slate tegas untuk Jumlah */
    color: #0f172a;
    font-weight: 600;
  }

  th.col-selisih, td.col-selisih {
    background-color: #ffe4e6; /* Soft Rose/Pink */
    color: #9f1239;
  }
  th.col-selisih {
    font-weight: 700;
  }

  td.col-nonasn {
    background-color: #f8fafc;
    color: #64748b;
  }

  /* Pewarnaan Kolom Matriks per Formasi Guru SD & SMP */
  th.mat-ks, td.mat-ks { background-color: #eff6ff; }
  th.mat-kel, td.mat-kel { background-color: #f0fdf4; }
  th.mat-pai, td.mat-pai { background-color: #fefce8; }
  th.mat-pjok, td.mat-pjok { background-color: #fdf2f8; }
  th.mat-kri, td.mat-kri { background-color: #f5f3ff; }
  th.mat-kat, td.mat-kat { background-color: #ecfeff; }
  th.mat-pkn, td.mat-pkn { background-color: #fef2f2; }
  th.mat-indo, td.mat-indo { background-color: #f0fdfa; }
  th.mat-mtk, td.mat-mtk { background-color: #e0e7ff; }
  th.mat-ipa, td.mat-ipa { background-color: #dcfce7; }
  th.mat-ips, td.mat-ips { background-color: #fef9c3; }
  th.mat-inggris, td.mat-inggris { background-color: #e0f2fe; }
  th.mat-tik, td.mat-tik { background-color: #fae8ff; }
  th.mat-sbk, td.mat-sbk { background-color: #ffe4e6; }
  th.mat-bk, td.mat-bk { background-color: #f1f5f9; }
  th.mat-jawa, td.mat-jawa { background-color: #ecfdf5; }
  th.mat-lain, td.mat-lain { background-color: #f8fafc; }
  th.mat-tot, td.mat-tot { background-color: #f1f5f9; }
  th.mat-tot-bth, td.mat-tot-bth { background-color: #e2e8f0; font-weight: 600; }
  th.mat-tot-sel, td.mat-tot-sel { background-color: #fee2e2; font-weight: 600; }

  .text-center { text-align: center !important; }
  .text-right { text-align: right !important; }

  /* Hover Baris Seragam dari Kolom Pertama sampai Terakhir */
  table.data-table tbody tr:hover td,
  table.data-table tbody tr.clickable-row:hover td {
    background-color: #e0f2fe !important; /* Soft sky-blue hover yang elegan & jelas dari ujung ke ujung */
  }

  /* Clickable Row / Item */
  .clickable-row {
    cursor: pointer;
  }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .badge-cpns { background: #e0f2fe; color: #0369a1; }
  .badge-pns { background: #dbeafe; color: #1e40af; }
  .badge-pppk { background: #dcfce7; color: #166534; }
  .badge-pw { background: #e0e7ff; color: #3730a3; }
  .badge-nonasn { background: #fef3c7; color: #92400e; }
  .badge-nonasn-old { background: #fef3c7; color: #92400e; } /* Kuning hangat untuk < 3-8-2023 */
  .badge-nonasn-new { background: #ffedd5; color: #c2410c; } /* Oranye muda untuk > 3-8-2023 */
  .badge-sd { background: #fee2e2; color: #991b1b; }
  .badge-smp { background: #e0e7ff; color: #3730a3; }

  /* Selisih (+/-) */
  .selisih-neg { background: #fee2e2; color: #b91c1c; font-weight: 800; padding: 3px 8px; border-radius: 6px; display: inline-block; }
  .selisih-pas { background: #dcfce7; color: #15803d; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }
  .selisih-pos { background: #e0f2fe; color: #0369a1; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }

  /* Loading & Modal */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .spinner {
    width: 46px;
    height: 46px;
    border: 4px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(2px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .modal-dialog {
    background: #fff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 1000px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
  }
  .modal-close {
    background: transparent;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px 8px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .modal-close:hover {
    color: var(--secondary);
    background: #f1f5f9;
  }
  .modal-body {
    padding: 16px 22px;
    overflow-y: auto;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }
  .modal-footer {
    padding: 12px 22px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: flex-end;
    background: #f8fafc;
  }

  /* Khusus Tabel di dalam Modal PTK */
  #modalTableWrap {
    border: 1px solid var(--border-color);
