<style>
  :root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #0f172a;
    --accent: #f59e0b;
    --success: #10b981;
    --info: #06b6d4;
    --danger: #ef4444;
    --warning: #f59e0b;
    
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius-md: 10px;
    --radius-lg: 16px;
    --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-main);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 60px;
  }

  .container { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

  /* Navbar */
  .navbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    padding: 16px 0;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-sm);
  }

  .navbar-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 22px;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
  }
  .brand-text h1 { font-size: 1.25rem; font-weight: 700; color: var(--secondary); letter-spacing: -0.02em; }
  .brand-text p { font-size: 0.8rem; color: var(--text-muted); }

  .nav-actions { display: flex; align-items: center; gap: 10px; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.875rem;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
  }
  .btn-primary { background-color: var(--primary); color: white; }
  .btn-primary:hover { background-color: var(--primary-hover); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
  .btn-secondary { background-color: #ffffff; color: var(--text-main); border-color: var(--border-color); }
  .btn-secondary:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
  .btn-success { background-color: var(--success); color: white; }
  .btn-success:hover { background-color: #059669; }

  /* Section Title */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 0 12px 0;
  }
  .section-header h2 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Filters Toolbar */
  .filters-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }

  .filters-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }

  .filter-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .filter-item label {
    font-size: 0.73rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .form-select, .form-input {
    padding: 8px 12px;
    font-size: 0.86rem;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background-color: #fff;
    color: var(--text-main);
    min-width: 170px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-select:focus, .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  /* KPI Grid Khusus Kebutuhan Formasi SD */
  .kpi-formasi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

  .kpi-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .kpi-title { font-size: 0.83rem; font-weight: 600; color: var(--text-muted); }
  .kpi-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }

  .icon-blue { background: #dbeafe; color: #1d4ed8; }
  .icon-green { background: #dcfce7; color: #15803d; }
  .icon-purple { background: #f3e8ff; color: #7e22ce; }
  .icon-amber { background: #fef3c7; color: #b45309; }
  .icon-cyan { background: #cffafe; color: #0e7490; }
  .icon-rose { background: #ffe4e6; color: #be123c; }

  .kpi-value {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--secondary);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .kpi-subtitle { font-size: 0.75rem; color: var(--text-muted); }

  /* Breadcrumb Navigation untuk Drilldown */
  .breadcrumb-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    background: #f1f5f9;
    padding: 8px 14px;
    border-radius: 8px;
    width: fit-content;
  }
  .breadcrumb-link {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }
  .breadcrumb-link:hover { text-decoration: underline; }
  .breadcrumb-current { font-weight: 700; color: var(--secondary); }

  /* Pill Toggle Button Bar untuk Formasi */
  .toggle-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: #f1f5f9;
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
  }
  .toggle-btn {
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--text-muted);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn:hover { color: var(--primary); }
  .toggle-btn.active {
    background: #ffffff;
    color: var(--primary);
    box-shadow: var(--shadow-sm);
  }

  /* Tabs Navigasi */
  .tabs-nav {
    display: flex;
    border-bottom: 2px solid var(--border-color);
    gap: 8px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 12px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--text-muted);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn:hover { color: var(--primary); }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  .tab-pane { display: none; animation: fadeIn 0.3s ease; }
  .tab-pane.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Card Tables */
  .card-table {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .card-header-bar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .card-header-bar h2 { font-size: 1.05rem; font-weight: 700; color: var(--secondary); }

  .table-responsive { width: 100%; overflow-x: auto; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.825rem; /* ~13.2px, standar dashboard profesional */
    text-align: left;
    font-feature-settings: "tnum", "zero";
    font-variant-numeric: tabular-nums;
  }

  table.data-table th {
    background-color: #f8fafc;
    color: #475569;
    font-weight: 600;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-color) !important;
    border-right: 1px solid #edf2f7;
    white-space: nowrap;
    line-height: 1.3;
  }

  table.data-table td {
    padding: 9px 12px;
    border-bottom: 1px solid #f1f5f9;
    border-right: 1px solid #f8fafc;
    color: #334155;
    font-size: 0.825rem;
    font-weight: 400;
    line-height: 1.4;
  }

  table.data-table tbody tr:hover {
    background-color: #f8fafc;
  }

  table.data-table tfoot th {
    background-color: #f8fafc;
    font-weight: 400; /* disamakan dengan isi baris td agar rapi dan seragam */
    font-size: 0.825rem; /* disamakan dengan ukuran 0.825rem baris data */
    color: #1e293b;
    padding: 9px 12px;
    border-top: 2px solid var(--border-color);
    letter-spacing: normal;
  }

  /* Pewarnaan Khusus Zona Kolom Kebutuhan, Keadaan, dan +/- */
  th.col-kebutuhan, td.col-kebutuhan {
    background-color: #dbeafe !important; /* Soft Blue yang jelas terlihat */
    color: #1e3a8a !important;
  }
  th.col-kebutuhan {
    font-weight: 700 !important;
    border-bottom: 1px solid var(--border-color) !important;
  }

  th.col-keadaan, td.col-keadaan {
    background-color: #f1f5f9 !important; /* Soft Slate Gray */
    color: #1e293b !important;
  }
  th.col-keadaan-total, td.col-keadaan-total {
    background-color: #e2e8f0 !important; /* Slate yang sedikit lebih tegas untuk Jumlah */
    color: #0f172a !important;
    font-weight: 600;
  }

  th.col-selisih, td.col-selisih {
    background-color: #ffe4e6 !important; /* Soft Rose/Pink yang jelas terlihat */
    color: #9f1239 !important;
  }
  th.col-selisih {
    font-weight: 700 !important;
    border-bottom: 1px solid var(--border-color) !important;
  }

  td.col-nonasn {
    background-color: #f8fafc !important;
    color: #64748b !important;
  }

  .text-center { text-align: center !important; }
  .text-right { text-align: right !important; }

  .text-center { text-align: center !important; }
  .text-right { text-align: right !important; }

  /* Clickable Row / Item */
  .clickable-row {
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .clickable-row:hover {
    background-color: #eff6ff !important;
  }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .badge-pns { background: #dbeafe; color: #1e40af; }
  .badge-pppk { background: #dcfce7; color: #166534; }
  .badge-pw { background: #e0e7ff; color: #3730a3; }
  .badge-nonasn { background: #fef3c7; color: #92400e; }
  .badge-sd { background: #fee2e2; color: #991b1b; }
  .badge-smp { background: #e0e7ff; color: #3730a3; }

  /* Selisih (+/-) */
  .selisih-neg { background: #fee2e2; color: #b91c1c; font-weight: 800; padding: 3px 8px; border-radius: 6px; display: inline-block; }
  .selisih-pas { background: #dcfce7; color: #15803d; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }
  .selisih-pos { background: #e0f2fe; color: #0369a1; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: inline-block; }

  /* Loading & Modal */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .spinner {
    width: 46px;
    height: 46px;
    border: 4px solid #e2e8f0;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-dialog {
    background: #fff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg);
  }
  .modal-header { padding: 16px 22px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
  .modal-body { padding: 18px 22px; overflow-y: auto; }
  .modal-footer { padding: 12px 22px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; }
</style>
